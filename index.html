<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>HOLOPLOT and AutoCAD Practice — GitHub Web App</title>
<style>
  :root{
    --bg:#0E1013; --surface:#171A20; --surface2:#22262F; --border:#333945;
    --text:#E9ECF1; --dim:#9AA3B2; --cyan:#22D3EE; --cyan-dim:#164E63; --amber:#F59E0B; --amber-dim:#78350F;
    --red:#7F1D1D; --red-text:#FECACA; --green:#34D399;
    --map-bg:#0B1220;
    --header-h:auto;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#EEF0F3; --surface:#FFFFFF; --surface2:#E7EAEF; --border:#C9CFDA;
      --text:#171B22; --dim:#5B6574;
      --map-bg:#0B1220;
    }
  }
  *{ box-sizing:border-box; max-width:100%; }
  html{ -webkit-text-size-adjust:100%; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; }
  body{ margin:0; background:var(--bg); color:var(--text);
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    height:100dvh; max-height:100dvh; display:flex; flex-direction:column; overflow:hidden; overscroll-behavior:none;
    padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); }
  [hidden]{ display:none !important; }
  .mono{ font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  button{ font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
  input,select{ font:inherit; color:var(--text); min-width:0; }
  input[type="range"]{ height:48px; accent-color:var(--cyan); cursor:pointer; touch-action:none; }
  input[type="range"]::-webkit-slider-thumb{ width:34px; height:34px; }
  input[type="checkbox"]{ width:26px; height:26px; accent-color:var(--cyan); flex:none; }
  /* ---- app shell: header + main == exactly 100dvh ---- */
  .wrap{ width:100%; max-width:none; margin:0; padding:0 clamp(8px,1.6vw,28px) calc(6px + env(safe-area-inset-bottom,0px)); flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  @media(min-width:640px){ .wrap{ padding-left:14px; padding-right:14px; } }

  header{ flex:0 0 auto; position:relative; z-index:40; background:#121418; border-bottom:1px solid #333945;
    padding-top:env(safe-area-inset-top,0px); }
  .header-in{ max-width:none; margin:0; padding:8px clamp(10px,1.6vw,28px); display:flex; flex-wrap:nowrap; align-items:center; gap:10px; min-width:0; }
  @media(min-width:640px){ .header-in{ padding:8px 14px; } }
  .ws-switch{ display:flex; border-radius:14px; overflow:hidden; border:1px solid #333945; flex:1 1 auto; min-width:0; }
  @media(min-width:760px){ .ws-switch{ flex:0 1 430px; } }
  .ws-switch button{ flex:1; min-height:56px; padding:8px 10px; font-size:15px; font-weight:700; border:0; background:#1B1E24; color:#E6E8EB; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ws-switch button.on-h{ background:var(--cyan-dim); color:#67E8F9; }
  .ws-switch button.on-c{ background:var(--amber-dim); color:#FCD34D; }
  .progress-box{ flex:1 1 180px; min-width:110px; }
  @media(max-width:639px){ .progress-box{ display:none; } }
  .progress-track{ height:8px; border-radius:99px; background:#232730; margin-top:3px; overflow:hidden; }
  .progress-fill{ height:100%; border-radius:99px; transition:width .3s; }
  .tutor-toggle{ flex:0 0 auto; min-height:56px; padding:8px 16px; border-radius:14px; font-size:15px; font-weight:700; border:1px solid #333945; background:#22262F; color:#E6E8EB; white-space:nowrap; }
  .tutor-toggle.on{ background:var(--cyan-dim); color:#67E8F9; }
  .edition-note{ font-size:11px; color:#9AA3B2; display:none; line-height:1.35; }
  @media(min-width:1100px){ .edition-note{ display:block; flex:0 1 260px; } }

  /* ---- workspace layout ---- */
  #ws-holoplot,#ws-autocad{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .ws-layout{ display:flex; flex-direction:column; flex:1 1 auto; min-height:0; height:100%; overflow:hidden; gap:8px; padding-top:8px; }
  .top-zone{ display:flex; flex-direction:column; flex:1 1 auto; min-height:0; gap:6px; overflow:hidden; }
  .top-zone-compact{ flex:0 0 auto; }
  .map-shell{ flex:1 1 auto; min-height:226px; display:flex; flex-direction:column; overflow:hidden; border-radius:14px; }
  .map-shell > svg{ flex:1 1 auto; min-height:0; height:auto !important; max-height:none !important; }
  .map-shell > *:not(svg){ flex:0 0 auto; }
  .cad-shell > *:not(svg){ flex:0 0 auto; }
  .cad-shell{ flex:1 1 auto; min-height:132px; display:flex; flex-direction:column; overflow:hidden; border-radius:14px; }
  .cad-shell > svg{ flex:1 1 auto; min-height:0; height:auto !important; max-height:none !important; }
  .scroll-panel{ flex:0 0 36%; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior:contain; scrollbar-gutter:stable; padding:2px 2px 10px; border-top:1px solid var(--border); }
  @media(max-height:860px) and (min-width:700px){
    .scroll-panel{ flex-basis:33%; }
    .chip{ min-height:76px !important; padding:10px !important; }
  }
  /* AutoCAD: canvas is the flexible space, deck scrolls below */
  #ws-autocad .scroll-panel{ flex-basis:33%; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; }
  .btn{ min-height:52px; padding:10px 16px; border-radius:12px; font-size:15px; font-weight:700; background:var(--surface2); border:1px solid var(--border); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn-sm{ min-height:48px; padding:8px 12px; font-size:14px; }
  .tog-on{ background:var(--cyan-dim) !important; color:#67E8F9 !important; }
  .field{ width:100%; border-radius:12px; padding:10px 12px; min-height:52px; font-size:16px; background:var(--surface2); border:1px solid var(--border); }
  .deck{ display:flex; border-radius:14px; overflow:hidden; border:1px solid var(--border); background:var(--surface); box-shadow:0 4px 14px rgba(0,0,0,.22); position:sticky; top:0; z-index:5; }
  .deck button{ flex:1; min-height:56px; padding:8px 4px; font-size:13px; font-weight:700; line-height:1.25; background:var(--surface); border:0; border-left:1px solid var(--border); min-width:0; }
  .deck button:first-child{ border-left:0; }
  @media(min-width:640px){ .deck button{ font-size:15px; } }
  .deck button.on-h{ background:var(--cyan-dim); color:#67E8F9; }
  .deck button.on-c{ background:var(--amber-dim); color:#FCD34D; }
  .mode-switch{ display:flex; border-radius:12px; overflow:hidden; border:1px solid var(--border); flex:0 1 300px; min-width:210px; }
  .mode-switch button{ flex:1; min-height:48px; padding:8px 12px; font-size:14px; font-weight:700; border:0; background:var(--surface); color:var(--text); white-space:nowrap; }
  .mode-switch button.on-p{ background:var(--cyan-dim); color:#67E8F9; }
  .mode-switch button.on-e{ background:var(--red); color:var(--red-text); }
  .edit-banner{ background:#2A1215; border:1px solid var(--red); color:var(--red-text); border-radius:12px; padding:10px 14px; font-size:13px; margin:0; }
  @media (prefers-color-scheme: light){ .edit-banner{ background:#FDECEC; color:#7F1D1D; } }
  .chip{ border-radius:12px; padding:12px; min-height:88px; background:var(--surface2); border:1px solid var(--border); cursor:pointer; text-align:left; overflow:hidden; }
  .chip.lit-h{ background:var(--cyan-dim); }
  .chip.lit-c{ background:var(--amber-dim); }
  .chip.editing{ border:2px solid #F87171; }
  .readout-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; padding:8px; background:var(--surface); flex:0 0 auto; }
  @media(min-width:640px){ .readout-grid{ grid-template-columns:repeat(6,minmax(0,1fr)); } }
  .readout{ background:var(--surface2); border-radius:10px; padding:8px 4px; text-align:center; min-width:0; }
  .readout .v{ font-weight:700; font-size:18px; white-space:nowrap; }
  .readout .l{ font-size:10px; color:var(--dim); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .slider-row{ margin-top:8px; background:var(--surface2); border-radius:12px; padding:8px 10px; min-width:0; }
  .stepper{ width:48px; height:48px; border-radius:12px; font-size:22px; font-weight:700; background:var(--surface); border:1px solid var(--border); flex:none; touch-action:manipulation; }
  .tool-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; flex:0 0 auto; }
  @media(min-width:640px){ .tool-grid{ grid-template-columns:repeat(6,minmax(0,1fr)); } }
  @media(min-width:1024px){ .tool-grid{ grid-template-columns:repeat(12,minmax(0,1fr)); } }
  .tool-grid button{ min-height:56px; padding:8px 2px; border-radius:14px; font-size:13px; font-weight:700; line-height:1.25; background:var(--surface); border:1px solid var(--border); min-width:0; overflow:hidden; }
  .tool-grid button.on{ background:var(--amber-dim); color:#FCD34D; border:2px solid var(--amber); }
  .legend-bar{ display:flex; flex-wrap:wrap; gap:4px 12px; padding:6px 10px; font-size:11px; align-items:center; background:#0F172A; color:#CBD5E1; flex:0 0 auto; }
  .swatch{ display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:5px; }
  .lesson{ background:var(--surface2); border-radius:12px; padding:12px; min-width:0; }
  .tutor-pill{ position:fixed; left:50%; transform:translateX(-50%); z-index:60; min-height:56px; padding:12px 22px;
    border-radius:99px; font-size:16px; font-weight:700; background:var(--cyan-dim); color:#A5F3FC; border:2px solid var(--cyan);
    box-shadow:0 10px 30px rgba(0,0,0,.45); max-width:94vw; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); }
  .grid2{ display:grid; gap:8px; } @media(min-width:768px){ .grid2{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .grid3{ display:grid; gap:8px; } @media(min-width:768px){ .grid3{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  a{ color:var(--cyan); }
  code{ background:var(--surface2); padding:1px 6px; border-radius:6px; font-size:.92em; overflow-wrap:anywhere; }
  svg{ touch-action:none; }
  .map-shell,.cad-shell{ position:relative; }
  .zoom-controls{ position:absolute; top:10px; right:10px; z-index:30; display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
  .zoom-controls .zoom-btn{ width:48px; flex:none; }
  .zoom-controls .view-switch{ align-self:flex-end; }
  .zoom-btn{ min-width:46px; min-height:46px; padding:5px 9px; border-radius:12px; font-size:22px; font-weight:800; line-height:1; background:rgba(23,26,32,.92); color:#E9ECF1; border:1px solid #4B5563; box-shadow:0 4px 14px rgba(0,0,0,.35); touch-action:manipulation; }
  .zoom-btn:active{ background:var(--cyan-dim); color:#67E8F9; }
  .zoom-reset{ font-size:13px; letter-spacing:.04em; }
  .zoom-pct{ text-align:center; font-size:12px; font-weight:700; padding:4px 6px; border-radius:8px; background:rgba(15,23,42,.88); color:#A5F3FC; border:1px solid #334155; }
  /* ---- dynamic viewport: the HOLOPLOT map surface fills its panel ---- */
  .map-shell > svg#h-svg{ width:100% !important; height:100% !important; flex:1 1 auto; }
  /* Plan / Side segmented switch — lives in the map's zoom cluster */
  .view-switch{ display:flex; flex-wrap:nowrap; max-width:336px; border-radius:12px; overflow:hidden; border:1px solid #4B5563; box-shadow:0 4px 14px rgba(0,0,0,.35); flex:none; }
  .view-switch button{ flex:1 1 58px; min-height:44px; padding:6px 8px; font-size:13px; font-weight:800; background:rgba(23,26,32,.92); color:#CBD5E1; border:0; touch-action:manipulation; }
  .view-switch button.on{ background:var(--cyan-dim); color:#67E8F9; }
  .anim-row{ display:flex; gap:4px; align-items:stretch; align-self:flex-end; }
  .anim-play{ width:auto !important; min-width:86px; font-size:13px !important; padding:6px 10px !important; }
  .anim-speed{ max-width:150px; }
  .anim-speed button{ flex:1 1 0; min-height:44px; padding:4px 6px; font-size:12px; }
  /* ---- view options + tape measure ---- */
  .tape-on{ background:var(--amber-dim) !important; color:#FCD34D !important; border-color:var(--amber) !important; }
  .vo-panel{ padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:8px; }
  .vo-panel h3{ margin:0; font-size:15px; }
  .vo-sec{ border-top:1px solid var(--border); margin-top:12px; padding-top:10px; }
  .vo-sec:first-of-type{ border-top:0; margin-top:8px; padding-top:0; }
  .vo-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .vo-lab{ font-weight:700; font-size:14px; margin:12px 0 0; }
  .vo-note{ font-size:12.5px; margin:6px 0 0; color:var(--dim); line-height:1.5; }
  @media(max-width:760px){ .anim-row{ align-self:stretch; } .anim-speed{ max-width:none; flex:1; } }
  /* narrow shells: the cluster becomes two clean full-width rows — the view
     switch on its own row (all five buttons, one line), zoom row beneath it —
     so nothing overlaps the map content or the zoom buttons */
  @media(max-width:760px){
    .map-shell .zoom-controls{ flex-direction:row; flex-wrap:wrap; justify-content:flex-end; left:8px; right:8px; top:8px; }
    .map-shell .view-switch{ flex:1 1 100%; max-width:none; flex-wrap:nowrap; align-self:stretch; }
    .map-shell .view-switch button{ flex:1 1 0; min-width:0; min-height:42px; padding:4px 3px; font-size:12px; }
    /* sim-time readout becomes one slim line UNDER the zoom row, so the zoom
       buttons stay in the second row of the cluster, near the map's top edge */
    .map-shell #h-anim-time{ order:10; flex:1 1 100%; text-align:left; font-size:10.5px; padding:2px 6px; }
    .map-shell .anim-speed button{ min-height:40px; }
    /* View / Tape / zoom share ONE row: compact the two labelled buttons,
       narrow the zoom buttons, and let the % readout ride that same row —
       otherwise + / − / FIT wrap onto a row below the shell's bottom edge,
       where the panel underneath paints over them and they go untappable */
    .map-shell #h-viewopts-btn, .map-shell #h-tape-btn{ font-size:12px !important; padding:5px 7px !important; }
    .map-shell .zoom-controls .zoom-btn{ width:44px; }
    /* the zoom/view/tape row rides directly under the view switch (order 1),
       ABOVE the waves row — the waves row is taller, and when the zoom row
       wrapped below it, − and FIT landed on the shell's bottom edge where
       the panel underneath paints over them */
    .map-shell #h-viewopts-btn, .map-shell #h-tape-btn, .map-shell #h-zoom-in, .map-shell #h-zoom-out, .map-shell #h-zoom-reset, .map-shell #h-zoom-pct{ order:1; }
    .map-shell .anim-row{ order:2; }
    .map-shell #h-tape-status{ order:11; flex:1 1 100%; text-align:left; }
    .render-needed-badge{ top:150px !important; }
  }
  /* ---- map resolution / render-on-demand controls (HOLOPLOT map only) ---- */
  .map-res-bar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; flex:0 0 auto; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:8px; }
  .map-res-bar .bar-label{ font-size:12px; font-weight:800; letter-spacing:.04em; color:var(--dim); padding:0 2px; }
  .seg{ display:flex; border-radius:12px; overflow:hidden; border:1px solid var(--border); flex:0 1 auto; }
  .seg button{ flex:1; min-height:52px; min-width:96px; padding:10px 14px; font-size:15px; font-weight:800; border:0; background:var(--surface2); color:var(--text); white-space:nowrap; }
  .seg button.on{ background:var(--cyan-dim); color:#67E8F9; }
  .seg button.on-amber{ background:var(--amber-dim); color:#FCD34D; }
  .render-info{ font-size:12px; font-weight:700; color:var(--dim); background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
  .render-info.stale{ color:#FCD34D; border-color:var(--amber); }
  .render-btn{ min-height:52px; padding:10px 18px; border-radius:12px; font-size:15px; font-weight:800; background:var(--cyan); color:#000; border:0; }
  .render-btn:disabled{ opacity:.45; }
  .render-needed-badge{ position:absolute; left:10px; top:10px; z-index:9; display:flex; flex-direction:column; gap:8px; align-items:stretch; background:rgba(120,53,15,.96); border:2px solid var(--amber); color:#FEF3C7; border-radius:14px; padding:10px 12px; box-shadow:0 10px 28px rgba(0,0,0,.5); width:248px; max-width:calc(100% - 90px); }
  .render-needed-badge span{ font-size:13px !important; }
  .render-needed-badge span{ font-size:14px; font-weight:800; line-height:1.3; }
  .render-now-btn{ min-height:52px; padding:10px 18px; border-radius:12px; font-size:16px; font-weight:900; background:var(--amber); color:#000; border:0; white-space:nowrap; }
  .readout-grid.stale{ opacity:.62; outline:2px dashed var(--amber); outline-offset:-2px; }
  /* ---- Pass 1: tap feedback, mode bar, honesty labels, stale clarity, undo toast ---- */
  button{ transition:transform .06s ease, filter .06s ease; }
  button:not(:disabled):active{ transform:scale(.95); filter:brightness(1.45); }
  .chip:active{ transform:scale(.98); filter:brightness(1.3); }
  input[type="checkbox"]:active{ transform:scale(.85); }
  select:active, input[type="number"]:active, input[type="text"]:active{ filter:brightness(1.25); }
  input[type="range"]:active{ filter:brightness(1.5) drop-shadow(0 0 6px rgba(34,211,238,.8)); }
  .tutor-pill:active{ transform:translateX(-50%) scale(.97); filter:brightness(1.3); }
  .modebar{ display:flex; flex-wrap:wrap; gap:6px; padding:8px 0 0; flex:0 0 auto; align-items:center; }
  .modebar .mchip{ font-size:12px; font-weight:800; padding:6px 10px; border-radius:99px; background:var(--surface2); border:1px solid var(--border); color:var(--dim); white-space:nowrap; }
  .modebar .mchip.edit{ background:var(--red); color:var(--red-text); border-color:#F87171; }
  .modebar .mchip.hot{ color:#FCD34D; border-color:var(--amber); }
  header.edit-tint{ background:#33161A; border-bottom:3px solid #F87171; }
  .map-model-note{ margin:0; padding:6px 12px; font-size:12px; font-weight:700; background:#0F172A; color:#FCD34D; flex:0 0 auto; }
  .practice-note{ margin:0; padding:6px 12px 0; font-size:12px; font-weight:800; color:var(--dim); background:var(--surface); flex:0 0 auto; }
  .practice-note.stale-note{ color:#FCD34D; }
  .map-shell.stale-map svg{ filter:saturate(.45) contrast(.97); }
  @keyframes renderPulse{ 0%{ box-shadow:0 0 0 0 rgba(245,158,11,.6);} 100%{ box-shadow:0 0 0 12px rgba(245,158,11,0);} }
  .render-btn.pulsing{ animation:renderPulse 1.1s ease-out infinite; background:var(--amber); }
  @media (prefers-reduced-motion: reduce){ .render-btn.pulsing{ animation:none; outline:3px solid var(--amber); outline-offset:2px; } }
  #undo-toast{ position:fixed; right:14px; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); z-index:80; display:flex; gap:10px; align-items:center; background:#0F2A33; border:2px solid var(--cyan); color:#E6E8EB; border-radius:14px; padding:10px 12px; box-shadow:0 14px 34px rgba(0,0,0,.5); max-width:min(430px,92vw); font-size:14px; font-weight:600; }
  /* ---- keyboard / Stream Deck layer: flash, focus ring, command chip ---- */
  .kbd-flash{ transform:scale(.95) !important; filter:brightness(1.45) !important; outline:3px solid var(--cyan) !important; outline-offset:1px; transition:none !important; }
  .slider-row.kbd-focused-row{ outline:3px solid var(--cyan); outline-offset:1px; box-shadow:0 0 0 4px rgba(34,211,238,.25); }
  #kbd-chip{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 128px); left:50%; transform:translateX(-50%); z-index:95; background:#0F2A33; border:2px solid var(--cyan); color:#A5F3FC; border-radius:99px; padding:9px 18px; font-size:15px; font-weight:800; box-shadow:0 12px 30px rgba(0,0,0,.5); pointer-events:none; white-space:nowrap; max-width:94vw; overflow:hidden; text-overflow:ellipsis; }
  .keys-map{ text-align:left; }
  .keys-map h4{ margin:14px 0 4px; font-size:13px; letter-spacing:.05em; color:#67E8F9; }
  .keys-map h4:first-child{ margin-top:4px; }
  .keys-map p{ margin:3px 0; font-size:13.5px; line-height:1.55; color:#E6E8EB; }
  .keys-map kbd{ background:#22262F; border:1px solid #4B5563; border-bottom-width:2px; border-radius:6px; padding:1px 6px; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; color:#FCD34D; white-space:nowrap; }
  #undo-toast button{ flex:none; }
  /* the CAD canvas strip is shorter than the HOLOPLOT map: always a horizontal row there,
     so the controls can never spill onto the command history / command line below */
  .cad-shell .zoom-controls{ flex-direction:row; align-items:center; top:8px; right:8px; }
  /* display-controls strip: one compact, aligned row */
  .display-controls{ display:flex; flex-direction:column; gap:6px; flex:0 0 auto; }
  .display-row{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; min-width:0; }
  .display-row .btn-sm{ min-height:48px; }
  /* tutor + github footers: compact bars that never push the workspace off-screen */
  #tutor-section{ flex:0 0 auto; margin-top:8px; min-width:0; }
  #tutor-section:empty{ display:none; }

  /* ---- responsive scaling: speaker chip row, fluid readouts, short windows ---- */

  /* ---- CONSOLIDATION FIX: narrow windows protect the map ----

  @media(max-width:760px){

  /* short windows (Quest browser, landscape phone, a flattened window):

  @media(max-height:600px){
    .pagebar{ flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; padding-bottom:4px; }

<script>
"use strict";
/* ================= shared ================= */
function splColor(spl){
  if(spl<55) return "#1e293b";
  if(spl<65) return "#1d4ed8";
  if(spl<75) return "#0891b2";
  if(spl<85) return "#16a34a";
  if(spl<92) return "#eab308";
  if(spl<98) return "#f97316";
  return "#ef4444";
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- on-device storage (static site: no server) ---------- */
var LS_KEY="holoplot-autocad-practice-github-v1";
var store={ progress:[], saves:{ holoplot:[], autocad:[] }, comments:[] };
try{ var raw=localStorage.getItem(LS_KEY); if(raw){ var p=JSON.parse(raw); if(p&&p.progress&&p.saves) store=p; } }catch(e){}
if(!Array.isArray(store.comments)) store.comments=[];
if(!store.saves.holoplot) store.saves.holoplot=[];
if(!store.saves.autocad) store.saves.autocad=[];
if(!Array.isArray(store.speakerGroups)) store.speakerGroups=[];
if(!Array.isArray(store.customVenues)) store.customVenues=[];
if(!store.mapPrefs||typeof store.mapPrefs!=="object") store.mapPrefs={res:"low",renderMode:"live"};
if(store.mapPrefs.res!=="high") store.mapPrefs.res="low";
if(store.mapPrefs.renderMode!=="ondemand") store.mapPrefs.renderMode="live";
function persistMapPrefs(){ store.mapPrefs={res:hs.resMode,renderMode:hs.renderMode}; persist(); }
if(!store.viewPrefs||typeof store.viewPrefs!=="object") store.viewPrefs={};
function persistViewPrefs(){ if(typeof hs==="undefined"||!hs.view) return; store.viewPrefs={origin:!!hs.view.origin,guidesShow:!!hs.view.guidesShow,gridShow:!!hs.view.gridShow,grid:hs.view.grid,snap:!!hs.view.snap,units:hs.view.units,precision:hs.view.precision}; persist(); }
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }
function doneSet(){ return new Set(store.progress); }
function markDone(id){ if(!store.progress.includes(id)){ store.progress.push(id); persist(); } renderProgress(); }
function commentsFor(ws){ return store.comments.filter(function(c){return c.ws===ws;}); }
function addSave(ws,name,data){ var snap=commentsFor(ws).map(function(c){return JSON.parse(JSON.stringify(c));}); store.saves[ws].push({id:Date.now(),name:name,data:data,comments:snap}); persist(); }
function deleteSave(ws,id){ store.saves[ws]=store.saves[ws].filter(function(s){return s.id!==id;}); persist(); }
function addComment(ws,target,author,text){ store.comments.push({id:Date.now()+Math.floor(Math.random()*999),ws:ws,target:target||"Current work",author:(author||"Isaac").trim()||"Isaac",text:text,created:new Date().toLocaleString(),resolved:false,replies:[]}); persist(); }
function deleteComment(id){ store.comments=store.comments.filter(function(c){return c.id!==id;}); persist(); }
function toggleResolveComment(id){ store.comments=store.comments.map(function(c){return c.id===id?Object.assign({},c,{resolved:!c.resolved}):c;}); persist(); }
function addReply(id,author,text){ store.comments=store.comments.map(function(c){ if(c.id!==id) return c; var r=(c.replies||[]).slice(); r.push({id:Date.now(),author:(author||"Isaac").trim()||"Isaac",text:text,created:new Date().toLocaleString()}); return Object.assign({},c,{replies:r}); }); persist(); }
/* ---------- undo toast (5s, one at a time) for destructive actions ---------- */
function snapshotStore(){ return JSON.stringify({saves:store.saves,comments:store.comments,speakerGroups:store.speakerGroups||[]}); }
function restoreStoreSnapshot(s){ try{ var o=JSON.parse(s); store.saves=o.saves; store.comments=o.comments; store.speakerGroups=o.speakerGroups||[]; persist(); }catch(e){} }

  {keys:["spl","sound pressure"],expl:"SPL (Sound Pressure Level) is loudness in decibels (dB) at a point in the room. On the coverage map each colour is an SPL band. Your goal is usually one even colour across the audience — not the loudest possible number."},

  {keys:["coverage"],expl:"Coverage is the share of the audience area inside the target band. Higher coverage means more seats are within the intended level range."},
  {keys:["gain"],expl:"Gain is the level trim for an array or beam, in dB. Use it to balance zones against each other — for example pulling a near stalls beam down so a far balcony beam can match it — rather than turning everything up."},
  {keys:["x1","x2","array"],expl:"X1 and X2 are HOLOPLOT array modules. One array can emit several independent beams at different zones, levels and EQ. In this practice app each box is one array you can steer with azimuth, tilt, beam width and gain."},
  {keys:["dimension","dim"],expl:"A dimension measures the real distance between two points so a crew can build from the drawing. In AutoCAD, use DIM, click the two points, and the measured length (in feet here) is written on the drawing. Always dimension the things that get built: stage width, hang points, clearances."},
  {keys:["layer"],expl:"Layers organise a drawing like transparent sheets: Walls, Speakers, Seating, Stage, Dimensions and Notes each get their own layer, colour and visibility switch. Draw each kind of object on its own layer so views can be turned on and off for different readers."},

/* true on touch-first devices (iPad / phone) where the browser fires synthetic
   mouseenter/focus on tap — a full re-render from those handlers would destroy
   the element being tapped before its click lands, swallowing the tap. */
function touchHoverNone(){ return !!(window.matchMedia && window.matchMedia("(hover: none)").matches); }

/* ---------- aspect-fit for map / canvas SVGs ----------
   An SVG whose shell is wider than its world aspect would letterbox the
   drawing into the middle. Instead, once laid out, set the element's width
   to height x (world W / world H) so the drawing fills the height and sits
   centred; on a narrow shell the width simply caps at 100% of the shell. */
function fitSvgShells(){
  document.querySelectorAll("svg[data-fw]").forEach(function(svg){
    if(svg.getAttribute("data-dyn")==="1"){ svg.style.width="100%"; return; } /* dynamic-viewport SVGs fill their panel */
    var shell=svg.parentElement; if(!shell) return;
    var avail=shell.clientWidth, h=svg.clientHeight;
    if(!avail||!h) return; /* hidden page — fitted when it is shown */
    var fw=Number(svg.getAttribute("data-fw")), fh=Number(svg.getAttribute("data-fh"));
    if(!fw||!fh) return;
    var w=Math.min(avail, Math.floor(h*fw/fh));
    if(w>0) svg.style.width=w+"px";
  });
}
function fitSvgShellsSoon(){ if(window.requestAnimationFrame) window.requestAnimationFrame(fitSvgShells); else fitSvgShells(); }

/* ---------- zoom / pan for maps & canvas (viewBox transform) ---------- */
function clampViewBox(st,W,H){ var vw=W/st.k, vh=H/st.k; if(st.x<0)st.x=0; if(st.y<0)st.y=0; if(st.x>W-vw)st.x=W-vw; if(st.y>H-vh)st.y=H-vh; if(st.k<=1){ st.k=1; st.x=0; st.y=0; } }
function zoomViewAt(st,W,H,fx,fy,nk){ nk=Math.max(1,Math.min(4,nk)); var vw=W/st.k, vh=H/st.k; var bx=st.x+fx*vw, by=st.y+fy*vh; st.k=nk; var nw=W/nk, nh=H/nk; st.x=bx-fx*nw; st.y=by-fy*nh; clampViewBox(st,W,H); }
function viewBoxStr(st,W,H){ return st.x+" "+st.y+" "+(W/st.k)+" "+(H/st.k); }
function attachZoomPan(svg,cfg){
  var pointers=new Map(); var panning=false, pinching=false, hadPinch=false;
  var downX=0, downY=0, downVX=0, downVY=0, lastDist=0, lastMX=0, lastMY=0, suppressUntil=0;
  /* dynamic-viewport callers pass getDims/viewBoxFn/clampFn/zoomAtFn; fixed-world
     callers (AutoCAD, Probe slices) keep the original fixed W/H behaviour */
  function dims(){ return cfg.getDims ? cfg.getDims() : {W:cfg.W, H:cfg.H}; }
  function clamp(st){ if(cfg.clampFn) cfg.clampFn(st); else clampViewBox(st,dims().W,dims().H); }
  function zoomAt(st,fx,fy,nk){ if(cfg.zoomAtFn) cfg.zoomAtFn(st,fx,fy,nk); else zoomViewAt(st,dims().W,dims().H,fx,fy,nk); }
  function apply(){ var st=cfg.getState(); svg.setAttribute("viewBox", cfg.viewBoxFn ? cfg.viewBoxFn(st) : viewBoxStr(st,dims().W,dims().H)); var pct=document.getElementById(cfg.pctId); if(pct) pct.textContent=Math.round(st.k*100)+"%"; }
  svg.addEventListener("gesturestart",function(e){ e.preventDefault(); });
  svg.addEventListener("pointerdown",function(e){
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(cfg.setActive) cfg.setActive(true);
    if(pointers.size===1){ downX=e.clientX; downY=e.clientY; var st=cfg.getState(); downVX=st.x; downVY=st.y; panning=false; }
    else if(pointers.size===2){ pinching=true; hadPinch=true; panning=false; var pts=Array.from(pointers.values());
      lastDist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y); lastMX=(pts[0].x+pts[1].x)/2; lastMY=(pts[0].y+pts[1].y)/2;
      try{ pointers.forEach(function(_,id){ svg.setPointerCapture(id); }); }catch(err){}
      if(cfg.onGestureStart) cfg.onGestureStart(); }
  });
  svg.addEventListener("pointermove",function(e){
    if(!pointers.has(e.pointerId)) return; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    var st=cfg.getState(); var r=svg.getBoundingClientRect(); if(!r.width||!r.height) return;
    if(pointers.size===1&&!pinching){
      var dx=e.clientX-downX, dy=e.clientY-downY;
      if(!panning&&Math.hypot(dx,dy)>7){ panning=true; if(cfg.onGestureStart) cfg.onGestureStart(); try{ svg.setPointerCapture(e.pointerId); }catch(err){} }
      if(panning){ var dd=dims(), vw=dd.W/st.k, vh=dd.H/st.k; st.x=downVX-dx/r.width*vw; st.y=downVY-dy/r.height*vh; clamp(st); apply(); }
    } else if(pointers.size===2){
      var pts=Array.from(pointers.values()); var dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
      var mx=(pts[0].x+pts[1].x)/2, my=(pts[0].y+pts[1].y)/2;
      var dd2=dims(), vw2=dd2.W/st.k, vh2=dd2.H/st.k; st.x-=(mx-lastMX)/r.width*vw2; st.y-=(my-lastMY)/r.height*vh2; clamp(st);
      if(lastDist>0&&dist>0){ zoomAt(st,(mx-r.left)/r.width,(my-r.top)/r.height,st.k*dist/lastDist); }
      lastDist=dist; lastMX=mx; lastMY=my; apply();
    }
  });
  function endPointer(e){
    var wasGesture=panning||pinching; pointers.delete(e.pointerId);
    if(pointers.size===0){
      if(wasGesture||hadPinch) suppressUntil=Date.now()+400;
      var isTap=!wasGesture&&!hadPinch&&e.type==="pointerup";
      panning=false; pinching=false; hadPinch=false; if(cfg.setActive) cfg.setActive(false);
      if(isTap&&cfg.onTap) cfg.onTap(e);
    } else if(pointers.size===1){
      var rem=Array.from(pointers.values())[0]; downX=rem.x; downY=rem.y; var st=cfg.getState(); downVX=st.x; downVY=st.y; panning=false; pinching=false;
    }
  }
  svg.addEventListener("pointerup",endPointer);
  svg.addEventListener("pointercancel",endPointer);
  svg.addEventListener("click",function(e){ if(Date.now()<suppressUntil){ e.stopPropagation(); e.preventDefault(); suppressUntil=0; } },true);
  svg.addEventListener("wheel",function(e){ e.preventDefault(); var r=svg.getBoundingClientRect(); if(!r.width) return; var st=cfg.getState(); zoomAt(st,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,st.k*(e.deltaY<0?1.15:1/1.15)); apply(); },{passive:false});
  return {apply:apply};
}

/* ---------- long-press helper ---------- */
function makeLongPress(){
  var timers={}, fired={};
  return {
    start:function(key,fn){ fired[key]=false; timers[key]=window.setTimeout(function(){ fired[key]=true; fn(); },600); },
    cancel:function(key){ if(timers[key]) window.clearTimeout(timers[key]); },
    wasFired:function(key){ return !!fired[key]; }
  };
}

function wireDisplayControls(root, st, rerender){
  function sync(){
    root.querySelector('[data-act="mode-practice"]').className = st.viewMode==="practice" ? "on-p" : "";
    root.querySelector('[data-act="mode-edit"]').className = st.viewMode==="edit" ? "on-e" : "";
    root.querySelector('[data-act="mode-practice"]').setAttribute("aria-selected", st.viewMode==="practice");
    root.querySelector('[data-act="mode-edit"]').setAttribute("aria-selected", st.viewMode==="edit");
    root.querySelector('[data-role="mode-hint"]').textContent = st.viewMode==="edit"
      ? "Edit Values mode: press and hold (long-press) any beam or dimension value label below to change its value."
      : "Practice mode: value labels are read-only.";
    root.querySelector('[data-role="edit-banner"]').hidden = st.viewMode!=="edit";
    var lg=root.querySelector('[data-act="tog-legend"]'); lg.textContent="Legend: "+(st.showLegend?"ON":"OFF"); lg.classList.toggle("tog-on",st.showLegend); lg.setAttribute("aria-pressed",st.showLegend);
    var ky=root.querySelector('[data-act="tog-keys"]'); ky.textContent="Keys & Labels: "+(st.showKeys?"ON":"OFF"); ky.classList.toggle("tog-on",st.showKeys); ky.setAttribute("aria-pressed",st.showKeys);
    var hv=root.querySelector('[data-act="tog-hover"]'); hv.textContent="Hover values: "+(st.showHover?"ON":"OFF"); hv.classList.toggle("tog-on",st.showHover); hv.setAttribute("aria-pressed",st.showHover);
    root.querySelector('[data-act="hover-momentary"]').classList.toggle("tog-on", st.hoverMode==="momentary");
    root.querySelector('[data-act="hover-latch"]').classList.toggle("tog-on", st.hoverMode==="latch");
    root.querySelector('[data-role="hover-hint"]').textContent = st.hoverMode==="momentary"
      ? "Momentary: values show only while you touch / hover the item."
      : "Latched: tap an item once and its values stay pinned until you tap it again.";
  }
  root.querySelector('[data-act="mode-practice"]').addEventListener("click",function(){ st.viewMode="practice"; sync(); rerender(); });
  root.querySelector('[data-act="mode-edit"]').addEventListener("click",function(){ st.viewMode="edit"; sync(); rerender(); });
  root.querySelector('[data-act="tog-legend"]').addEventListener("click",function(){ st.showLegend=!st.showLegend; sync(); rerender(); });
  root.querySelector('[data-act="tog-keys"]').addEventListener("click",function(){ st.showKeys=!st.showKeys; sync(); rerender(); });
  root.querySelector('[data-act="tog-hover"]').addEventListener("click",function(){ st.showHover=!st.showHover; sync(); rerender(); });
  root.querySelector('[data-act="hover-momentary"]').addEventListener("click",function(){ st.hoverMode="momentary"; sync(); rerender(); });
  root.querySelector('[data-act="hover-latch"]').addEventListener("click",function(){ st.hoverMode="latch"; sync(); rerender(); });
  sync();
  return sync;
}

function hProbeDefaultPos(){ var v=hVenue(); return {x:0, y:Math.round(Math.min(v.d-4, Math.max(6, v.d*0.45))*10)/10}; }

function gainToPos(g){ var sg=g>=0?1:-1; return Math.round(500+sg*500*(Math.log1p(Math.abs(g))/Math.log1p(12))); }
function posToGain(p){ var t=(p-500)/500; var sg=t>=0?1:-1; return Math.round(sg*(Math.expm1(Math.abs(t)*Math.log1p(12)))*10)/10; }

   audience (true perspective) and iso (axonometric). Plan and Side use a
   DYNAMIC viewport: the SVG fills its panel, and the visible world window is
   computed from the panel's measured aspect — uniform scale is kept (metres
   are never distorted), the venue is fitted, and the window EXPANDS along
   whichever dimension has spare room, so a landscape panel yields a
   landscape-shaped usable area instead of a portrait island. The 3D views

function hView(){ return hs.view||"plan"; }

function hZoomState(){ var v=hView(); if(v==="side") return hs.zoomSide; if(v==="stage") return hs.zoomStage; if(v==="aud") return hs.zoomAud; if(v==="iso") return hs.zoomIso; return hs.zoomPlan; }
function hPlanDims(){ var v=hVenue(); var W=Math.round(v.w*9+56); return {W:W, H:Math.round(v.d*11+46), CX:W/2}; }
var H_SIDE_BASE={W:640,H:480};
var H_3D_DIMS={W:720,H:520};
function hBaseDims(){ var v=hView(); if(v==="plan") return hPlanDims(); if(v==="side") return H_SIDE_BASE; return H_3D_DIMS; }
function hViewDims(){ return hBaseDims(); }
function hIsDyn(){ var v=hView(); return v==="plan"||v==="side"; }
function hDynAspect(){ var a=hs._aspect&&hs._aspect[hView()]; if(a&&isFinite(a)&&a>0.05&&a<20) return a; var b=hBaseDims(); return b.W/b.H; }
function hFitSize(){ var b=hBaseDims(), A=hDynAspect(); if(A>=b.W/b.H) return {W:Math.round(b.H*A), H:b.H}; return {W:b.W, H:Math.round(b.W/A)}; }

  if(!(st.k>1)){ st.k=1; st.x=Math.round((b.W-f.W)/2); st.y=Math.round((b.H-f.H)/2); return; }
  var vw=f.W/st.k, vh=f.H/st.k;

  if(st.x<xMin)st.x=xMin; if(st.x>xMax)st.x=xMax; if(st.y<yMin)st.y=yMin; if(st.y>yMax)st.y=yMax; }

function hMeasureAspect(){ var v=hView(); if(v!=="plan"&&v!=="side") return false; var svg=document.querySelector("#ws-holoplot .map-shell svg"); if(!svg) return false; var r=svg.getBoundingClientRect(); if(r.width<40||r.height<40) return false; var a=r.width/r.height; if(!hs._aspect) hs._aspect={}; var old=hs._aspect[v]; hs._aspect[v]=a; return !old||Math.abs(old-a)>0.01; }

/* Probe drag: a gesture that starts on the probe marker drags the probe and
   wins over the map pan (pointerdown is stopped before it reaches the svg).
   Aim + auto-balance re-run on every move; Live re-renders the heatmap softly,
   On Demand only moves the marker and lets the stale machinery catch up. */
function wireProbeDrag(root){

  var svg=root.querySelector(".map-shell svg"); if(!svg) return;

        out+='<ellipse cx="'+P.x+'" cy="'+P.y+'" rx="'+(r*sxm)+'" ry="'+(r*szm)+'" fill="none" stroke="'+(b.probe?"#F59E0B":"#7DD3FC")+'" stroke-width="2.2" opacity="'+op.toFixed(2)+'"/>'; }
      out+='</g>'; }); });
    if(hs.probe){ var arr2=hArrivals(); if(arr2.list.length){ var ph2=((t-arr2.list[0].ms)%H_WAVE_PERIOD+H_WAVE_PERIOD)%H_WAVE_PERIOD; var pr2=ph2/H_WAVE_PERIOD;
      out+='<circle cx="'+G.SX(hs.probe.y)+'" cy="'+G.SY(1.5)+'" r="'+(7+pr2*11)+'" fill="none" stroke="#F59E0B" stroke-width="2.6" opacity="'+(0.85*(1-pr2)).toFixed(2)+'"/>'; } }

function cUseAsRoom(){

  if(!pts){ var rects=cs.shapes.filter(function(s){return s.type==="rect";});
    if(rects.length){ var br=rects[0]; rects.forEach(function(s){ if(Math.abs((s.x2-s.x1)*(s.y2-s.y1))>Math.abs((br.x2-br.x1)*(br.y2-br.y1))) br=s; });

      [s.y1-rr,s.y2-rr].forEach(function(y){ if(y<mny2)mny2=y; }); [s.y1+rr,s.y2+rr].forEach(function(y){ if(y>mxy2)mxy2=y; });

  else if(up==="PL"||up==="PLINE"){ cs.tool="polyline"; cLog("PLINE — specify points, then Finish Polyline:"); }
  else if(up==="A"||up==="ARC"){ cs.tool="arc"; cLog("ARC — specify start point:"); }
  else if(up==="DIM"||up==="D"){ cs.tool="dim"; cLog("DIMENSION — pick two points to measure:"); }
  else if(up==="E"||up==="ERASE"){ cs.tool="erase"; cLog("ERASE — click an object to delete it."); }
  else if(up==="SELECT"){ cs.tool="select"; cLog("SELECT — click an object to inspect it."); }
  else if(up==="U"||up==="UNDO"){ cUndo(); return; }
  else if(up==="CLEAR"){ cPushUndo(); cs.shapes=[]; cLog("All objects erased."); }
  else if(up==="SNAP ON"){ cs.snap=true; cLog("Snap ON"); }
  else if(up==="SNAP OFF"){ cs.snap=false; cLog("Snap OFF"); }
  else if(up==="ORTHO ON"){ cs.ortho=true; cLog("Ortho ON"); }
  else if(up==="ORTHO OFF"){ cs.ortho=false; cLog("Ortho OFF"); }
  else if(up.indexOf("TEMPLATE")===0){ cLoadTemplate(up.indexOf("ROOM")>=0?"room":up.indexOf("SPEAKER")>=0?"speakers":"stage"); return; }
  else cLog('Unknown command "'+c+'" — type HELP.');
  renderAutocad();
}

function cCanvasSVG(){

  cs.shapes.filter(function(sh){return layerVisible(sh.layer);}).forEach(function(sh){
    var col=layerColor(sh.layer), w=sh.id===cs.selected?0.45:0.28, attrs='data-shape="'+sh.id+'" stroke="'+col+'" stroke-width="'+w+'" fill="none" style="cursor:pointer"';
    if(sh.type==="line") s+='<line x1="'+sh.x1+'" y1="'+sh.y1+'" x2="'+sh.x2+'" y2="'+sh.y2+'" '+attrs+'/>';
    else if(sh.type==="dim"){ s+='<g data-shape="'+sh.id+'" style="cursor:pointer"><line x1="'+sh.x1+'" y1="'+sh.y1+'" x2="'+sh.x2+'" y2="'+sh.y2+'" stroke="'+col+'" stroke-width="0.22"/>'+

    else if(sh.type==="rect") s+='<rect x="'+Math.min(sh.x1,sh.x2)+'" y="'+Math.min(sh.y1,sh.y2)+'" width="'+Math.abs(sh.x2-sh.x1)+'" height="'+Math.abs(sh.y2-sh.y1)+'" '+attrs+'/>';
    else if(sh.type==="circle") s+='<g data-shape="'+sh.id+'" style="cursor:pointer"><circle cx="'+sh.x1+'" cy="'+sh.y1+'" r="'+sh.r+'" stroke="'+col+'" stroke-width="'+w+'" fill="none"/><line x1="'+(sh.x1-0.8)+'" y1="'+sh.y1+'" x2="'+(sh.x1+0.8)+'" y2="'+sh.y1+'" stroke="'+col+'" stroke-width="0.15"/><line x1="'+sh.x1+'" y1="'+(sh.y1-0.8)+'" x2="'+sh.x1+'" y2="'+(sh.y1+0.8)+'" stroke="'+col+'" stroke-width="0.15"/></g>';

  });
  var hov=cs.shapes.find(function(sh){return cShapeVisible(sh.id)&&layerVisible(sh.layer);});

  return s+'</svg>';

    store.saves.autocad.forEach(function(s){ html+='<div style="display:flex;gap:8px;margin-top:10px"><button data-cload="'+s.id+'" class="btn" style="flex:1;text-align:left">Load: '+esc(s.name)+'</button><button data-cdel="'+s.id+'" class="btn" aria-label="Delete '+esc(s.name)+'">✕</button></div>'; });
    html+='</section>';
  }
  html+='</div></div>';
  html+='<div id="c-lessons">'+lessonsHTML(C_LESSONS, cs.openLesson)+'</div>'+githubNoteHTML();
  html+='</div></div>';
  root.innerHTML=html;
  var _nsp=root.querySelector("[data-scroll-panel]"); if(_nsp) _nsp.scrollTop=_spTop;

  /* wiring */
  wireDisplayControls(document.getElementById("c-display"), cs, renderAutocad);
  root.querySelectorAll("[data-tool]").forEach(function(b){ b.addEventListener("click",function(){ cs.tool=b.getAttribute("data-tool"); cs.pending=[]; cLog(b.textContent.trim()+" active."); renderAutocad(); }); });
  document.getElementById("c-undo").addEventListener("click",cUndo);
  document.getElementById("c-finish").addEventListener("click",cFinishPoly);
  document.getElementById("c-clear").addEventListener("click",function(){ cPushUndo(); cs.shapes=[]; renderAutocad(); });
  document.getElementById("c-snap").addEventListener("click",function(){ cs.snap=!cs.snap; renderAutocad(); });
  document.getElementById("c-ortho").addEventListener("click",function(){ cs.ortho=!cs.ortho; renderAutocad(); });
  document.getElementById("c-grid").addEventListener("click",function(){ cs.showGrid=!cs.showGrid; renderAutocad(); });
  root.querySelectorAll("[data-template]").forEach(function(b){ b.addEventListener("click",function(){ cLoadTemplate(b.getAttribute("data-template")); }); });
  root.querySelectorAll("[data-cdeck]").forEach(function(b){ b.addEventListener("click",function(){ cs.deck=b.getAttribute("data-cdeck"); renderAutocad(); }); });
  var sc=document.getElementById("c-selshortcut"); if(sc) sc.addEventListener("click",function(){ cs.deck="props"; renderAutocad(); });
  var cmdInput=document.getElementById("c-cmd");
  cmdInput.addEventListener("input",function(e){ cs.cmd=e.target.value; });
  document.getElementById("c-cmdform").addEventListener("submit",function(e){ e.preventDefault(); var v=cs.cmd; cs.cmd=""; cRunCommand(v); });
  var hist=document.getElementById("c-history"); hist.scrollTop=hist.scrollHeight;

  var svg=document.getElementById("cad-svg");
  svg.addEventListener("pointermove",function(e){ var p=cToWorld(e,svg); if(p.x!==cs.cursor.x||p.y!==cs.cursor.y){ cs.cursor=p;
    var cv=document.getElementById("ch-v"), ch=document.getElementById("ch-h");
    if(cv){ cv.setAttribute("x1",p.x); cv.setAttribute("x2",p.x); } if(ch){ ch.setAttribute("y1",p.y); ch.setAttribute("y2",p.y); }
    var status=hist.lastElementChild; if(status) status.textContent="Cursor: "+p.x.toFixed(0)+", "+p.y.toFixed(0)+" ft · Tool: "+cs.tool.toUpperCase()+" · Layer: "+cs.activeLayer+" · Objects: "+cs.shapes.length;
  } });
  wireCadZoom(svg);
  var czi=document.getElementById("c-zoom-in"); if(czi) czi.addEventListener("click",function(){ cZoomBy(1.4); });
  var czo=document.getElementById("c-zoom-out"); if(czo) czo.addEventListener("click",function(){ cZoomBy(1/1.4); });
  var czr=document.getElementById("c-zoom-reset"); if(czr) czr.addEventListener("click",function(){ cZoomReset(); });
  svg.querySelectorAll("[data-shape]").forEach(function(el){
    var id=Number(el.getAttribute("data-shape"));
    el.addEventListener("mouseenter",function(){ if(cs._gesturing) return; if(cs.hovered!==id){ cs.hovered=id; renderAutocad(); } });
    el.addEventListener("mouseleave",function(){ cLP.cancel("shape"+id); if(cs._gesturing) return; if(cs.hovered!==null){ cs.hovered=null; renderAutocad(); } });
    el.addEventListener("pointerdown",function(){ if(cs.viewMode==="edit") cLP.start("shape"+id,function(){ cs.selected=id; cs.editing=id; cs.deck="dims"; renderAutocad(); }); });
    el.addEventListener("pointerup",function(){ cLP.cancel("shape"+id); });
    el.addEventListener("click",function(){ if(cLP.wasFired("shape"+id)) return;
      if(cs.tool==="erase"){ cPushUndo(); cs.shapes=cs.shapes.filter(function(x){return x.id!==id;}); cLog("Object erased."); }
      else { cs.selected=id; if(cs.hoverMode==="latch"&&cs.showHover){ var i=cs.latched.indexOf(id); if(i>=0)cs.latched.splice(i,1); else cs.latched.push(id); } }
      renderAutocad(); });
  });
  root.querySelectorAll("[data-dchip]").forEach(function(ch){
    var id=Number(ch.getAttribute("data-dchip"));
    ch.addEventListener("mouseenter",function(){ if(cs.hovered!==id){ cs.hovered=id; renderAutocad(); } });
    ch.addEventListener("mouseleave",function(){ if(cs.hovered!==null){ cs.hovered=null; renderAutocad(); } cLP.cancel("dchip"+id); });
    ch.addEventListener("focus",function(){ if(cs.hovered!==id){ cs.hovered=id; renderAutocad(); } });
    ch.addEventListener("blur",function(){ if(cs.hovered!==null){ cs.hovered=null; renderAutocad(); } });
    ch.addEventListener("click",function(){ if(cLP.wasFired("dchip"+id)) return; cs.selected=id;
      if(cs.hoverMode==="latch"&&cs.showHover){ var i=cs.latched.indexOf(id); if(i>=0)cs.latched.splice(i,1); else cs.latched.push(id); }
      renderAutocad(); });
    ch.addEventListener("pointerdown",function(){ if(cs.viewMode==="edit") cLP.start("dchip"+id,function(){ cs.selected=id; cs.editing=id; renderAutocad(); }); });
    ch.addEventListener("pointerup",function(){ cLP.cancel("dchip"+id); });
    ch.addEventListener("contextmenu",function(e){ if(cs.viewMode==="edit"){ e.preventDefault(); cs.selected=id; cs.editing=id; renderAutocad(); } });
  });
  root.querySelectorAll("[data-edit-shape]").forEach(function(b){ b.addEventListener("click",function(e){ e.stopPropagation(); cs.selected=Number(b.getAttribute("data-edit-shape")); cs.editing=cs.selected; renderAutocad(); }); });
  var ef=document.getElementById("c-editform");
  if(ef){ ef.addEventListener("submit",function(e){ e.preventDefault(); var fd=new FormData(ef);
      var es=cs.shapes.find(function(s){return s.id===cs.editing;}); if(!es) return;
      function num(n,fb){ var v=Number(fd.get(n)); return isFinite(v)?v:fb; }
      var nx1=num("x1",es.x1), ny1=num("y1",es.y1), nx2=num("x2",es.x2), ny2=num("y2",es.y2), nr=num("r",es.r);
      var ntext=String(fd.get("text")||es.text), isDim=es.type==="dim";
      var autoDim=Math.hypot(nx2-nx1,ny2-ny1).toFixed(1)+" ft";
      cPushUndo();
      cs.shapes=cs.shapes.map(function(x){ return x.id===es.id?Object.assign({},x,{x1:nx1,y1:ny1,x2:nx2,y2:ny2,r:nr,text:isDim?autoDim:ntext}):x; });
      cs.editMsg="Saved "+es.type.toUpperCase()+": ("+nx1+","+ny1+") → ("+nx2+","+ny2+")"+(isDim?" · dimension now "+autoDim:"")+" — drawing updated.";
      cs.editing=null; cLog("Edited "+es.type.toUpperCase()+" via Edit Values mode."); renderAutocad(); });
    document.getElementById("c-edit-cancel").addEventListener("click",function(){ cs.editing=null; renderAutocad(); });
  }
  if(cs.deck==="layers"){
    root.querySelectorAll("[data-layer]").forEach(function(b){ b.addEventListener("click",function(){ cs.activeLayer=b.getAttribute("data-layer"); renderAutocad(); }); });
    root.querySelectorAll("[data-layervis]").forEach(function(b){ b.addEventListener("click",function(){ var n=b.getAttribute("data-layervis"); cs.layers=cs.layers.map(function(x){return x.name===n?Object.assign({},x,{visible:!x.visible}):x;}); renderAutocad(); }); });
    document.getElementById("c-textval").addEventListener("input",function(e){ cs.textVal=e.target.value; });
  }
  if(cs.deck==="props"&&sel){
    var gd=document.getElementById("c-godims"); if(gd) gd.addEventListener("click",function(){ cs.deck="dims"; renderAutocad(); });
    var er=document.getElementById("c-erasesel"); if(er) er.addEventListener("click",function(){ cPushUndo(); cs.shapes=cs.shapes.filter(function(x){return x.id!==sel.id;}); cs.selected=null; renderAutocad(); });
  }
  if(cs.deck==="drills"){ root.querySelectorAll("[data-cdrill]").forEach(function(b){ b.addEventListener("click",function(){ markDone(b.getAttribute("data-cdrill")); renderAutocad(); }); }); }
  if(cs.deck==="save"){
    document.getElementById("c-savename").addEventListener("input",function(e){ cs.saveName=e.target.value; });
    document.getElementById("c-save").addEventListener("click",function(){ addSave("autocad", cs.saveName||"Untitled drawing", JSON.stringify({shapes:cs.shapes,layers:cs.layers})); renderAutocad(); });
    document.getElementById("c-share").addEventListener("click",function(){ var link=buildShareLink("autocad", cs.saveName||"Untitled drawing", {shapes:cs.shapes,layers:cs.layers}, commentsFor("autocad")); presentShareLink(link, this); });
    document.getElementById("c-useroom").addEventListener("click",function(){ cUseAsRoom(); });
    root.querySelectorAll("[data-cload]").forEach(function(b){ b.addEventListener("click",function(){ var s=store.saves.autocad.find(function(x){return x.id===Number(b.getAttribute("data-cload"));}); if(!s) return; try{ var d=JSON.parse(s.data); cs.zoom={k:1,x:0,y:0}; cs.shapes=d.shapes; if(d.layers) cs.layers=d.layers; cs.shapes.forEach(function(sh){ if(sh.id>=nextShapeId) nextShapeId=sh.id+1; }); }catch(e){} renderAutocad(); }); });
    root.querySelectorAll("[data-cdel]").forEach(function(b){ b.addEventListener("click",function(){ var snap=snapshotStore(); deleteSave("autocad", Number(b.getAttribute("data-cdel"))); renderAutocad(); showUndoToast("Saved drawing deleted.", function(){ restoreStoreSnapshot(snap); renderAutocad(); }); }); });
  }
  wireLessons(document.getElementById("c-lessons"), C_LESSONS, cs, renderAutocad);
  fitSvgShellsSoon();
}
</script>
<script>
"use strict";
/* ================= app shell: workspaces, progress, tutor ================= */
var TOTAL_ITEMS=H_LESSONS.length+C_LESSONS.length+H_DRILLS.length+4;
var currentWs="holoplot", currentPage="holoplot";
var aggState={ openLesson:null, commentWs:"holoplot", commentFilter:"all", replyOpen:null, author:"Isaac" };
function renderProgress(){
  var n=doneSet().size, pct=Math.round(n/TOTAL_ITEMS*100);
  var lbl=document.getElementById("progress-label"); if(lbl) lbl.textContent=n+"/"+TOTAL_ITEMS+" · "+pct+"%";
  var f=document.getElementById("progress-fill"); if(f){ f.style.width=pct+"%"; f.style.background=currentWs==="holoplot"?"var(--cyan)":"var(--amber)"; }
}
function downloadJSON(filename, obj){
  try{ var blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}); var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },800); }catch(e){}
}
function renderLessonsPage(){
  var el=document.getElementById("page-lessons"); if(!el) return;
  el.innerHTML='<div class="page-scroll"><h2 style="margin:0;font-size:20px">📚 Lessons — both topics in one place</h2><p style="color:var(--dim);font-size:14px;margin:6px 0 0">HOLOPLOT and AutoCAD lessons together. Open one, read it, try it in its workspace, then mark it complete. Progress counts toward the header bar.</p>'+
  '<h3 style="margin:18px 0 0">◉ HOLOPLOT</h3><div id="agg-h-lessons">'+lessonsHTML(H_LESSONS, aggState.openLesson)+'</div>'+
  '<h3 style="margin:18px 0 0">⌖ AutoCAD</h3><div id="agg-c-lessons">'+lessonsHTML(C_LESSONS, aggState.openLesson)+'</div></div>';
  wireLessons(document.getElementById("agg-h-lessons"), H_LESSONS, aggState, renderLessonsPage);
  wireLessons(document.getElementById("agg-c-lessons"), C_LESSONS, aggState, renderLessonsPage);
}
function renderDrillsPage(){
  var el=document.getElementById("page-drills"); if(!el) return;
  var comp=hCompute(), stats=comp.stats, done=doneSet();
  var h='<div class="page-scroll"><h2 style="margin:0;font-size:20px">🎯 Drills — both topics in one place</h2><p style="color:var(--dim);font-size:14px;margin:6px 0 0">HOLOPLOT drills check your live coverage map. AutoCAD drills check your live drawing. Do the work in the workspace, then claim here or there — both stay in sync.</p>';
  h+='<h3 style="margin:18px 0 0">◉ HOLOPLOT coverage drills</h3><div class="grid3">';
  H_DRILLS.forEach(function(d){ var pass=d.test(stats,comp)&&(!d.needs2||hs.arrays.filter(function(a){return a.on;}).length>=2); var isDone=done.has(d.id);
    h+='<div class="card" style="margin-top:8px;padding:14px"><p style="margin:0;font-weight:700">'+esc(d.title)+'</p><p style="font-size:14px;color:var(--dim);margin:4px 0 0">'+esc(d.goal)+'</p><p class="mono" style="font-size:13px;margin:6px 0 0">Now: avg '+stats.avg+' dB · ±'+stats.uni+' dB · spill '+stats.spill+'%</p><button data-agg-hdrill="'+d.id+'" '+((!pass||isDone)?"disabled":"")+' class="btn" style="margin-top:10px;width:100%">'+(isDone?"Completed ✓":pass?"Claim drill ✓":"Keep steering in HOLOPLOT…")+'</button></div>'; });
  h+='</div><h3 style="margin:18px 0 0">⌖ AutoCAD drafting drills</h3><div class="grid2">';
  cDrills().forEach(function(d){ var isDone=done.has(d.id);
    h+='<div class="card" style="margin-top:8px;padding:14px;display:flex;gap:12px;align-items:center"><span style="font-size:20px">'+((d.pass||isDone)?"✅":"⬜")+'</span><div style="flex:1"><p style="margin:0;font-weight:700">'+esc(d.title)+'</p><p style="margin:2px 0 0;font-size:14px;color:var(--dim)">'+esc(d.hint)+'</p></div><button data-agg-cdrill="'+d.id+'" '+((!d.pass||isDone)?"disabled":"")+' class="btn">'+(isDone?"Done":"Claim")+'</button></div>'; });
  h+='</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn" id="agg-go-h" style="flex:1">Open HOLOPLOT workspace ›</button><button class="btn" id="agg-go-c" style="flex:1">Open AutoCAD workspace ›</button></div></div>';
  el.innerHTML=h;
  el.querySelectorAll("[data-agg-hdrill]").forEach(function(b){ b.addEventListener("click",function(){ markDone(b.getAttribute("data-agg-hdrill")); renderDrillsPage(); renderHoloplot(); }); });
  el.querySelectorAll("[data-agg-cdrill]").forEach(function(b){ b.addEventListener("click",function(){ markDone(b.getAttribute("data-agg-cdrill")); renderDrillsPage(); renderAutocad(); }); });
  document.getElementById("agg-go-h").addEventListener("click",function(){ setPage("holoplot"); });
  document.getElementById("agg-go-c").addEventListener("click",function(){ setPage("autocad"); });
}
function renderProjectsPage(){
  var el=document.getElementById("page-projects"); if(!el) return;
  function block(ws,title){
    var list=store.saves[ws]; var h='<h3 style="margin:18px 0 0">'+title+' ('+list.length+')</h3>';
    if(!list.length) h+='<p style="color:var(--dim);font-size:14px">Nothing saved yet. Save from the workspace Save deck and it will appear here with its comments.</p>';
    list.forEach(function(s){ var cc=(s.comments||[]).length;
      h+='<div class="card" style="margin-top:8px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center"><div style="flex:1;min-width:180px"><p style="margin:0;font-weight:700">'+esc(s.name)+'</p><p style="margin:2px 0 0;font-size:12px;color:var(--dim)">'+new Date(s.id).toLocaleString()+' · '+cc+' comment'+(cc===1?"":"s")+' bundled</p></div>'+
      '<button class="btn btn-sm" data-proj-load="'+ws+':'+s.id+'">Load</button><button class="btn btn-sm" data-proj-share="'+ws+':'+s.id+'">🔗 Share link</button><button class="btn btn-sm" data-proj-export="'+ws+':'+s.id+'">⬇ Export</button><button class="btn btn-sm" data-proj-del="'+ws+':'+s.id+'" aria-label="Delete '+esc(s.name)+'">✕ Delete</button></div>'; });
    return h;
  }
  el.innerHTML='<div class="page-scroll"><h2 style="margin:0;font-size:20px">💾 Projects — saved designs &amp; drawings</h2><p style="color:var(--dim);font-size:14px;margin:6px 0 0">Your whole library for both workspaces in one place, stored on this device in this browser. Export downloads a JSON file containing the design/drawing plus the comments bundled with it, so work travels with its discussion.</p>'+
  block("holoplot","◉ HOLOPLOT designs")+block("autocad","⌖ AutoCAD drawings")+
  '<button class="btn" id="proj-export-all" style="width:100%;margin-top:18px">⬇ Export everything (designs, drawings &amp; all comments) as JSON</button></div>';
  el.querySelectorAll("[data-proj-load]").forEach(function(b){ b.addEventListener("click",function(){ var p=b.getAttribute("data-proj-load").split(":"); var ws=p[0], id=Number(p[1]); var s=store.saves[ws].find(function(x){return x.id===id;}); if(!s) return;
    try{ var d=JSON.parse(s.data); if(ws==="holoplot"){ hLoadDesignData(d); hs.saveName=s.name; } else { cs.shapes=d.shapes; if(d.layers) cs.layers=d.layers; cs.shapes.forEach(function(sh){ if(sh.id>=nextShapeId) nextShapeId=sh.id+1; }); cs.saveName=s.name; } }catch(e){}
    if(ws==="holoplot") renderHoloplot(); else renderAutocad(); setPage(ws); }); });
  el.querySelectorAll("[data-proj-del]").forEach(function(b){ b.addEventListener("click",function(){ var p=b.getAttribute("data-proj-del").split(":"); var snap=snapshotStore(); deleteSave(p[0], Number(p[1])); renderProjectsPage(); if(p[0]==="holoplot") renderHoloplot(); else renderAutocad(); showUndoToast("Saved design deleted.", function(){ restoreStoreSnapshot(snap); renderProjectsPage(); if(p[0]==="holoplot") renderHoloplot(); else renderAutocad(); }); }); });
  el.querySelectorAll("[data-proj-share]").forEach(function(b){ b.addEventListener("click",function(){ var p=b.getAttribute("data-proj-share").split(":"); var s=store.saves[p[0]].find(function(x){return x.id===Number(p[1]);}); if(!s) return; var dobj={}; try{ dobj=JSON.parse(s.data); }catch(e){} presentShareLink(buildShareLink(p[0], s.name, dobj, s.comments||[]), b); }); });
  el.querySelectorAll("[data-proj-export]").forEach(function(b){ b.addEventListener("click",function(){ var p=b.getAttribute("data-proj-export").split(":"); var s=store.saves[p[0]].find(function(x){return x.id===Number(p[1]);}); if(s) downloadJSON(s.name.replace(/[^a-z0-9-_]+/gi,"-")+".json", s); }); });
  document.getElementById("proj-export-all").addEventListener("click",function(){ downloadJSON("holoplot-autocad-projects.json", store); });
}
function renderCommentsPage(){
  var el=document.getElementById("page-comments"); if(!el) return;
  var filter=aggState.commentFilter;
  var list=store.comments.filter(function(c){ return filter==="all"||c.ws===filter; }).slice().reverse();
  var curTarget= aggState.commentWs==="holoplot" ? (hs.saveName||"Current HOLOPLOT design") : (cs.saveName||"Current AutoCAD drawing");
  var h='<div class="page-scroll"><h2 style="margin:0;font-size:20px">💬 Comments</h2>'+
  '<p style="color:var(--dim);font-size:14px;margin:6px 0 0;line-height:1.55"><strong style="color:var(--text)">On-device comments for now.</strong> Comments live in this browser on this device, attached to a HOLOPLOT design or AutoCAD drawing. When you save a design/drawing, its workspace comments are bundled into that save and into its export, so the discussion travels with the work. This is not live multi-user editing yet — real-time collaboration needs a shared backend, which is a separate follow-on.</p>';
  h+='<section class="card" style="padding:14px;margin-top:12px"><h3 style="margin:0;font-size:16px">Add a comment</h3>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><div class="mode-switch" role="group" aria-label="Comment workspace"><button data-cws="holoplot" class="'+(aggState.commentWs==="holoplot"?"on-p":"")+'">◉ HOLOPLOT</button><button data-cws="autocad" class="'+(aggState.commentWs==="autocad"?"on-e":"")+'" style="'+(aggState.commentWs==="autocad"?"background:var(--amber-dim);color:#FCD34D":"")+'">⌖ AutoCAD</button></div>'+
  '<input id="cm-author" class="field" style="flex:1;min-width:140px" value="'+esc(aggState.author)+'" aria-label="Your name" placeholder="Your name"/></div>'+
  '<p style="font-size:13px;color:var(--dim);margin:8px 0 0">Attaching to: <strong style="color:var(--text)">'+esc(curTarget)+'</strong></p>'+
  '<label class="sr-only" for="cm-text">Comment text</label><textarea id="cm-text" class="field" rows="3" style="margin-top:8px;resize:vertical" placeholder="e.g. Balcony beam feels hot at the back — check tilt before the show…"></textarea>'+
  '<button id="cm-add" class="btn" style="width:100%;margin-top:10px;background:var(--cyan);color:#000;border:0">Post comment</button><p id="cm-msg" style="font-size:13px;margin:8px 0 0;color:var(--green)" role="status"></p></section>';
  h+='<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap" role="group" aria-label="Filter comments">'+[["all","All"],["holoplot","HOLOPLOT"],["autocad","AutoCAD"]].map(function(f){return '<button class="btn btn-sm'+(filter===f[0]?" tog-on":"")+'" data-cfilter="'+f[0]+'">'+f[1]+' ('+(f[0]==="all"?store.comments.length:commentsFor(f[0]).length)+')</button>';}).join("")+'</div>';
  if(!list.length) h+='<p style="color:var(--dim);font-size:15px;margin-top:14px">No comments here yet. Post the first one above — a note to your future self, or a question to pick up with a collaborator once live sync lands.</p>';
  list.forEach(function(c){
    h+='<article class="comment-card'+(c.resolved?" resolved":"")+'"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="badge">'+(c.ws==="holoplot"?"◉ HOLOPLOT":"⌖ AutoCAD")+'</span><span class="badge">'+esc(c.target)+'</span>'+(c.resolved?'<span class="badge" style="color:var(--green)">✓ Resolved</span>':'<span class="badge">Open</span>')+'<span style="margin-left:auto;font-size:12px;color:var(--dim)">'+esc(c.created)+'</span></div>'+
    '<p style="margin:8px 0 0;font-size:15px;line-height:1.55"><strong>'+esc(c.author)+':</strong> '+esc(c.text)+'</p>';
    (c.replies||[]).forEach(function(r){ h+='<div class="reply-box"><p style="margin:0;font-size:14px;line-height:1.5"><strong>'+esc(r.author)+':</strong> '+esc(r.text)+'</p><p style="margin:2px 0 0;font-size:11px;color:var(--dim)">'+esc(r.created)+'</p></div>'; });
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn btn-sm" data-creply="'+c.id+'">↩ Reply</button><button class="btn btn-sm" data-cresolve="'+c.id+'">'+(c.resolved?"Reopen":"✓ Resolve")+'</button><button class="btn btn-sm" data-cdel="'+c.id+'">✕ Delete</button></div>';
    if(aggState.replyOpen===c.id) h+='<div style="margin-top:10px"><label class="sr-only" for="cm-reply-'+c.id+'">Reply text</label><textarea id="cm-reply-'+c.id+'" class="field" rows="2" placeholder="Write a reply…"></textarea><button class="btn" data-creply-send="'+c.id+'" style="width:100%;margin-top:8px">Post reply</button></div>';
    h+='</article>';

/* ================= PROBE TAB — MRI-style sound slices through the probe =================
   A slice is a real cross-section of the same model the plan map uses: per beam,
   the plan SPL at (px,py) plus a vertical falloff around the ear plane (z=0)
   that widens with distance by the beam's vertical width, clamped like the
   horizontal falloff. At z=0 the falloff is 0, so the TOP slice at offset 0 is
   exactly the plan field — its crosshair value equals the probe readout. */
var probePage={ plane:"top", offset:0, solo:null, zoom:{k:1,x:0,y:0} };
function hSliceSplAt(arrays, px, py, pz, soloKey){
  var tot=0, any=false;
  arrays.forEach(function(a){ if(!a.on) return; hBeams(a).forEach(function(b,bi){ if(hs.layerOn[b.layer]===false) return; if(soloKey&&(a.id+":"+bi)!==soloKey) return;
    var spl=hBeamSplAt(a,b,px,py);
    var dx=px-a.x, dy=py-a.y, dh=Math.sqrt(dx*dx+dy*dy);
    var halfW=Math.max(1.2, dh*Math.tan(Math.max(4,b.vBeam)*Math.PI/180));
    var fv=-14*Math.pow(pz/halfW,2); if(fv<-32) fv=-32;
    tot+=Math.pow(10,(spl+fv)/10); any=true; }); });
  return any?Math.round(10*Math.log10(tot)*10)/10:null;
}
function renderProbePage(){
  var el=document.getElementById("page-probe"); if(!el) return;
  try{ renderProbePageInner(el); }
  catch(e){ el.innerHTML='<div class="page-scroll"><section class="card" style="padding:16px;max-width:680px"><h2 style="margin:0;font-size:17px">🛰 Probe slices</h2><p style="font-size:15px;margin:10px 0 0">The slice viewer hit a snag rendering this design. Your probe, tags and design are unchanged.</p></section></div>'; if(window.console&&console.error) console.error("renderProbePage",e); }
}

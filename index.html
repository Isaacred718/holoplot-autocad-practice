<script>
"use strict";
/* ================= KEYBOARD + STREAM DECK LAYER =================
   ONE keydown dispatcher. Every binding drives the EXACT SAME on-screen
   control (its .click()) or, when that control lives on a deck tab that is
   not currently shown, the exact statements that control's handler runs —
   so linking math, fan, probe balance and parity can never drift.
   Dialects: plain keys (keyboard) and ⌥-chords / F13–F19 (Stream Deck)
   resolve to the same commands. No Cmd/Ctrl combos. */
var KBD_PARAMS=[{k:"az",label:"Azimuth",step:1,unit:"°"},{k:"tilt",label:"Tilt",step:1,unit:"°"},{k:"hBeam",label:"Beam width",step:1,unit:"°"},{k:"gain",label:"Gain",step:0.5,unit:" dB"},{k:"x",label:"Pos X",step:1,unit:" m"},{k:"y",label:"Pos Y",step:1,unit:" m"}];
if(!hs.kbdFocus) hs.kbdFocus="az";
function kbdFocusParam(){ for(var i=0;i<KBD_PARAMS.length;i++) if(KBD_PARAMS[i].k===hs.kbdFocus) return KBD_PARAMS[i]; return KBD_PARAMS[0]; }
function kbdChip(name){
  var c=document.getElementById("kbd-chip"); if(!c) return;
  c.textContent="⌨ "+name; c.hidden=false;
  if(window._kbdChipT) window.clearTimeout(window._kbdChipT);
  window._kbdChipT=window.setTimeout(function(){ c.hidden=true; },1700);
}
function kbdFlashEl(el){ if(!el||!el.classList) return; el.classList.add("kbd-flash"); window.setTimeout(function(){ el.classList.remove("kbd-flash"); },420); }
function kbdFlashSel(sel){ if(sel) kbdFlashEl(document.querySelector(sel)); }
/* click the real control; fallback runs only when the control is on a hidden deck tab */
function kbdClick(sel,name,fallback){
  var el=sel?document.querySelector(sel):null;
  if(el&&!el.disabled){ el.click(); kbdFlashSel(sel); }
  else if(fallback){ fallback(); kbdFlashSel(sel); }
  else if(el){ kbdFlashEl(el); }
  kbdChip(name);
}
function kbdClickTimes(sel,times){
  for(var i=0;i<times;i++){ var el=document.querySelector(sel); if(!el||el.disabled) break; el.click(); }
  kbdFlashSel(sel);
}
function kbdTyping(){
  var a=document.activeElement; if(!a) return false;
  if(a.isContentEditable) return true;
  var tag=a.tagName;
  if(tag==="TEXTAREA"||tag==="SELECT") return true;
  if(tag==="INPUT"){ var t=(a.getAttribute("type")||"text").toLowerCase(); return ["text","number","search","email","url","password","tel","date",""].indexOf(t)>=0; }
  return false;
}
/* ---- shared command implementations ---- */
function kbdSelectArray(id,name){
  kbdClick('[data-sel-arr="'+id+'"]',"Select "+name,function(){ hs.sel=id; hs.editing=null; renderHoloplot(); });
}
function kbdSelectBeam(idx){
  kbdClick('[data-beam-sel="'+idx+'"]',"Select Beam "+(idx+1),function(){ hs.selBeam=idx; hs.editing=null; renderHoloplot(); });
}
function kbdToggleLayer(L){
  kbdClick('[data-layer-tog="'+L+'"]',L+" layer "+(hs.layerOn[L]===false?"ON":"OFF"),null);
}
function kbdCycleFocus(dir){
  var keys=KBD_PARAMS.map(function(p){return p.k;});
  var i=keys.indexOf(hs.kbdFocus); if(i<0) i=0;
  i=((i+dir)%keys.length+keys.length)%keys.length;
  hs.kbdFocus=keys[i];
  renderHoloplot();
  kbdFlashSel('[data-fader="'+hs.kbdFocus+'"]');
  kbdChip("Focus: "+KBD_PARAMS[i].label);
}
function kbdStepFocused(dir,coarse){
  var p=kbdFocusParam(), n=coarse?5:1, sel='[data-step="'+p.k+":"+(dir>0?"1":"-1")+'"]';
  kbdClickTimes(sel,n);
  var amt=Math.round(p.step*n*10)/10;
  kbdChip(p.label+" "+(dir>0?"+":"−")+amt+p.unit);
}
function kbdAim(param,dir,coarse){
  var n=coarse?5:1, sel='[data-step="'+param+":"+(dir>0?"1":"-1")+'"]';
  kbdClickTimes(sel,n);
  kbdChip((param==="az"?"Azimuth":"Tilt")+" "+(dir>0?"+":"−")+(coarse?5:1)+"°");
}
function kbdFan(){
  var p=kbdFocusParam();
  var fanKey=(p.k==="az"||p.k==="tilt"||p.k==="gain")?p.k:null;
  if(fanKey){ kbdClick('[data-fan="'+fanKey+'"]',"Fan "+p.label,null); return; }
  if(p.k==="hBeam"){ if(hs.linked.length>=2){ hFan("hBeam"); renderHoloplot(); } kbdChip("Fan Beam width"); return; }
  kbdChip("Fan — position cannot fan");
}
function kbdRenderModeSet(mode){
  var sel=mode==="live"?"#h-mode-live":"#h-mode-ondemand";
  kbdClick(sel,mode==="live"?"Render: Live":"Render: On Demand",null);
}
function kbdRender(){ kbdClick(document.getElementById("h-render-btn")?"#h-render-btn":"#h-render-now","Render",null); }
function kbdProbeToggle(){
  if(hs.probe) kbdClick("#h-probe-remove","Probe removed",null);
  else kbdClick("#h-probe-add","Probe added",null);
}
function kbdProbeNudge(dx,dy){
  if(!hs.probe){ kbdChip("Probe nudge — no probe"); return; }
  var v=hVenue();
  hs.probe.x=Math.round(Math.min(v.w/2-1,Math.max(-v.w/2+1,hs.probe.x+dx))*10)/10;
  hs.probe.y=Math.round(Math.min(v.d-1,Math.max(1,hs.probe.y+dy))*10)/10;
  hProbeSync();
  if(currentPage==="probe") renderProbePage(); else renderHoloplot();
  kbdChip("Probe → "+hs.probe.x+" m, "+hs.probe.y+" m");
}
function kbdProbeBeamKeys(){
  var out=[]; hs.arrays.forEach(function(a){ hBeams(a).forEach(function(b,bi){ out.push({key:a.id+":"+bi,label:a.name+" Beam "+(bi+1)}); }); }); return out;
}
function kbdProbeCycle(dir){
  var list=kbdProbeBeamKeys(); if(!list.length) return;
  var i=(typeof probePage._cyc==="number")?probePage._cyc:0;
  i=((i+dir)%list.length+list.length)%list.length;
  probePage._cyc=i;
  kbdFlashSel('[data-solo="'+list[i].key+'"]');
  kbdChip("Beam: "+list[i].label+" (S = solo)");
}
function kbdDispatch(e){
  if(e.metaKey||e.ctrlKey) return;                 /* browser territory */
  if(kbdTyping()) return;                            /* typing guard — Esc keeps native meaning */
  var code=e.code||"", key=e.key||"";
  var page=currentPage;
  function done(){ e.preventDefault(); }
  /* ---- F13–F19: deck selection dialect ---- */
  var fnum=/^F(1[3-9])$/.test(key)?Number(key.slice(1)):0;
  if(fnum){
    if(page==="holoplot"){
      if(fnum===13){ kbdSelectArray(1,"Array L"); done(); return; }
      if(fnum===14){ kbdSelectArray(2,"Array R"); done(); return; }
      if(fnum===15){ kbdSelectArray(3,"Centre"); done(); return; }
      if(fnum>=16&&fnum<=18){ kbdSelectBeam(fnum-16); done(); return; }
      if(fnum===19){ kbdClick(hs.resMode==="high"?"#h-res-low":"#h-res-high",hs.resMode==="high"?"Res: Low":"Res: High",null); done(); return; }
    }
    if(page==="probe"){
      var planes=["top","front","side"];
      if(fnum>=13&&fnum<=15){ kbdClick('[data-pplane="'+planes[fnum-13]+'"]',"Slice: "+planes[fnum-13],null); done(); return; }
    }
    return;
  }
  /* ---- ⌥ chords: deck dialect + keyboard Option chords ---- */
  if(e.altKey){
    var digit=/^Digit([1-7])$/.exec(code);
    if(digit){
      var pages=["holoplot","probe","autocad","lessons","drills","projects","comments"];
      var labels=["HOLOPLOT","Probe","AutoCAD","Lessons","Drills","Projects","Comments"];
      var pi=Number(digit[1])-1;
      kbdClick('.pagebar [data-page="'+pages[pi]+'"]',"Page: "+labels[pi],null); done(); return;
    }
    if(e.shiftKey&&page==="holoplot"){
      if(code==="KeyL"){ kbdRenderModeSet("live"); done(); return; }
      if(code==="KeyD"){ kbdRenderModeSet("ondemand"); done(); return; }
      if(code==="KeyP"){ kbdProbeToggle(); done(); return; }
    }
    if(code==="KeyE"){
      if(page==="autocad"){ var ce=cs.viewMode==="edit"; kbdClick('#c-display [data-act="'+(ce?"mode-practice":"mode-edit")+'"]',"Edit Values "+(ce?"OFF":"ON"),null); }
      else { var he=hs.viewMode==="edit"; kbdClick('#h-display [data-act="'+(he?"mode-practice":"mode-edit")+'"]',"Edit Values "+(he?"OFF":"ON"),null); }
      done(); return;
    }
    if(code==="KeyT"){ var tb=document.getElementById("tutor-toggle"); if(tb){ tb.click(); kbdFlashEl(tb); } kbdChip("Tutor "+(tutorOn?"ON":"OFF")); done(); return; }
    if(code==="KeyZ"){
      var toast=document.getElementById("undo-toast");
      if(toast&&!toast.hidden){ kbdClick("#undo-toast-btn","Undo",null); }
      else if(page==="autocad"){ kbdClick("#c-undo","CAD Undo",null); }
      else kbdChip("Undo — nothing to undo");
      done(); return;
    }
    if((page==="holoplot"||page==="probe")&&(key.indexOf("Arrow")===0||/^Arrow/.test(code))){
      var st=e.shiftKey?2:0.5;
      if(code==="ArrowLeft"||key==="ArrowLeft") kbdProbeNudge(-st,0);
      else if(code==="ArrowRight"||key==="ArrowRight") kbdProbeNudge(st,0);
      else if(code==="ArrowUp"||key==="ArrowUp") kbdProbeNudge(0,-st);
      else if(code==="ArrowDown"||key==="ArrowDown") kbdProbeNudge(0,st);
      done(); return;
    }
    if(page==="holoplot"){
      if(code==="KeyL"){ kbdClick('[data-link-tog="'+hs.sel+'"]',"Link toggle: "+hCur().name,function(){ var i=hs.linked.indexOf(hs.sel); if(i>=0) hs.linked.splice(i,1); else hs.linked.push(hs.sel); if(hs.linked.length<2){ hs.invertPan=false; hs.invertTilt=false; } renderHoloplot(); }); done(); return; }
      if(code==="KeyF"){ kbdFan(); done(); return; }
      if(code==="KeyX"){ kbdClick('[data-invert="az"]',"Invert Pan "+(hs.invertPan?"OFF":"ON"),null); done(); return; }
      if(code==="KeyC"){ kbdClick('[data-invert="tilt"]',"Invert Tilt "+(hs.invertTilt?"OFF":"ON"),null); done(); return; }
      if(code==="KeyR"){ kbdRender(); done(); return; }
      if(code==="KeyP"){ kbdClick("#h-tag-probe",hCurBeam().probe?"Untag beam from Probe":"Tag beam to Probe",function(){ var b=hCurBeam(); if(!hs.probe) return; b.probe=!b.probe; hProbeSync(); renderHoloplot(); }); done(); return; }
    }
    if(page==="autocad"){
      if(code==="KeyS"){ kbdClick("#c-snap","Snap "+(cs.snap?"OFF":"ON"),null); done(); return; }
      if(code==="KeyO"){ kbdClick("#c-ortho","Ortho "+(cs.ortho?"OFF":"ON"),null); done(); return; }
      if(code==="KeyG"){ kbdClick("#c-grid","Grid "+(cs.showGrid?"OFF":"ON"),null); done(); return; }
    }
    return;
  }
  /* ---- plain keys: page-scoped ---- */
  if(page==="holoplot"){
    var d=/^Digit([0-9])$/.exec(code);
    if(d){
      var n=Number(d[1]);
      if(e.shiftKey){ if(n>=1&&n<=3){ kbdSelectBeam(n-1); done(); } return; }
      if(n===1){ kbdSelectArray(1,"Array L"); done(); return; }
      if(n===2){ kbdSelectArray(2,"Array R"); done(); return; }
      if(n===3){ kbdSelectArray(3,"Centre"); done(); return; }
      if(n===4){ kbdToggleLayer("Main"); done(); return; }
      if(n===5){ kbdToggleLayer("Balcony"); done(); return; }
      if(n===6){ kbdToggleLayer("Fill"); done(); return; }
      return;
    }
    if(code==="BracketLeft"){ kbdCycleFocus(-1); done(); return; }
    if(code==="BracketRight"){ kbdCycleFocus(1); done(); return; }
    if(code==="Minus"){ kbdStepFocused(-1,e.shiftKey); done(); return; }
    if(code==="Equal"){ kbdStepFocused(1,e.shiftKey); done(); return; }
    if(code==="ArrowLeft"){ kbdAim("az",-1,e.shiftKey); done(); return; }
    if(code==="ArrowRight"){ kbdAim("az",1,e.shiftKey); done(); return; }
    if(code==="ArrowUp"){ kbdAim("tilt",1,e.shiftKey); done(); return; }
    if(code==="ArrowDown"){ kbdAim("tilt",-1,e.shiftKey); done(); return; }
    if(code==="KeyF"){ kbdFan(); done(); return; }
    if(code==="KeyX"){ kbdClick('[data-invert="az"]',"Invert Pan "+(hs.invertPan?"OFF":"ON"),null); done(); return; }
    if(code==="KeyC"){ kbdClick('[data-invert="tilt"]',"Invert Tilt "+(hs.invertTilt?"OFF":"ON"),null); done(); return; }
    if(code==="KeyR"){
      if(e.shiftKey){ kbdClick(hs.resMode==="high"?"#h-res-low":"#h-res-high",hs.resMode==="high"?"Res: Low":"Res: High",null); }
      else kbdRender();
      done(); return;
    }
    if(code==="KeyV"){ kbdRenderModeSet(hs.renderMode==="live"?"ondemand":"live"); done(); return; }
    if(code==="KeyP"){ kbdProbeToggle(); done(); return; }
    return;
  }
  if(page==="probe"){
    var d2=/^Digit([0-9])$/.exec(code);
    if(d2&&!e.shiftKey){
      var n2=Number(d2[1]), planes2=["top","front","side"];
      if(n2>=1&&n2<=3){ kbdClick('[data-pplane="'+planes2[n2-1]+'"]',"Slice: "+planes2[n2-1],null); done(); return; }
      if(n2===0){ kbdClick("#p-centre","Centre on probe",function(){ probePage.offset=0; renderProbePage(); }); done(); return; }
      return;
    }
    if(code==="Minus"){ kbdClickTimes('[data-poff="-0.5"]',e.shiftKey?5:1); kbdChip("Slice offset −"+(e.shiftKey?"2.5":"0.5")+" m"); done(); return; }
    if(code==="Equal"){ kbdClickTimes('[data-poff="0.5"]',e.shiftKey?5:1); kbdChip("Slice offset +"+(e.shiftKey?"2.5":"0.5")+" m"); done(); return; }
    if(code==="BracketLeft"){ kbdProbeCycle(-1); done(); return; }
    if(code==="BracketRight"){ kbdProbeCycle(1); done(); return; }
    if(code==="KeyS"){
      var list=kbdProbeBeamKeys(); if(!list.length) return;
      var idx=(typeof probePage._cyc==="number")?probePage._cyc:0; if(idx>=list.length) idx=0;
      kbdClick('[data-solo="'+list[idx].key+'"]',"Solo: "+list[idx].label,function(){ probePage.solo=(probePage.solo===list[idx].key?null:list[idx].key); renderProbePage(); });
      done(); return;
    }
    if(code==="KeyA"){ kbdClick("#p-allbeams","All beams",function(){ probePage.solo=null; renderProbePage(); }); done(); return; }
    return;
  }
  if(page==="autocad"){
    if(code==="Digit0"&&!e.shiftKey){ kbdClick("#c-zoom-reset","Zoom Extents",null); done(); return; }
    var tools={KeyL:["line","Line"],KeyC:["circle","Circle"],KeyR:["rect","Rectang"],KeyP:["polyline","Pline"],KeyA:["arc","Arc"],KeyD:["dim","Dimension"],KeyT:["text","Text"],KeyE:["erase","Erase"]};
    var t=tools[code];
    if(t){ kbdClick('[data-tool="'+t[0]+'"]',"Tool: "+t[1],null); done(); return; }
    return;
  }
}
document.addEventListener("keydown",kbdDispatch);
</script>
</body>

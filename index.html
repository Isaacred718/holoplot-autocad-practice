<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>HOLOPLOT and AutoCAD Practice — GitHub Web App</title>
<style>
  :root{
    --bg:#0E1013; --surface:#171A20; --surface2:#22262F; --border:#333945;
    --text:#E9ECF1; --dim:#9AA3B2; --cyan:#22D3EE; --cyan-dim:#164E63; --amber:#F59E0B; --amber-dim:#78350F;
    --red:#7F1D1D; --red-text:#FECACA; --green:#34D399;
    --map-bg:#0B1220;
    --header-h:auto;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#EEF0F3; --surface:#FFFFFF; --surface2:#E7EAEF; --border:#C9CFDA;
      --text:#171B22; --dim:#5B6574;
      --map-bg:#0B1220;
    }
  }
  *{ box-sizing:border-box; max-width:100%; }
  html{ -webkit-text-size-adjust:100%; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; }
  body{ margin:0; background:var(--bg); color:var(--text);
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    height:100dvh; max-height:100dvh; display:flex; flex-direction:column; overflow:hidden; overscroll-behavior:none;
    padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); }
  [hidden]{ display:none !important; }
  .mono{ font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  button{ font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
  input,select{ font:inherit; color:var(--text); min-width:0; }
  input[type="range"]{ height:48px; accent-color:var(--cyan); cursor:pointer; touch-action:none; }
  input[type="range"]::-webkit-slider-thumb{ width:34px; height:34px; }
  input[type="checkbox"]{ width:26px; height:26px; accent-color:var(--cyan); flex:none; }
  /* ---- app shell: header + main == exactly 100dvh ---- */
  .wrap{ width:100%; max-width:1400px; margin:0 auto; padding:0 10px calc(6px + env(safe-area-inset-bottom,0px)); flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  @media(min-width:640px){ .wrap{ padding-left:14px; padding-right:14px; } }

  header{ flex:0 0 auto; position:relative; z-index:40; background:#121418; border-bottom:1px solid #333945;
    padding-top:env(safe-area-inset-top,0px); }
  .header-in{ max-width:1400px; margin:0 auto; padding:8px 10px; display:flex; flex-wrap:nowrap; align-items:center; gap:10px; min-width:0; }
  @media(min-width:640px){ .header-in{ padding:8px 14px; } }
  .ws-switch{ display:flex; border-radius:14px; overflow:hidden; border:1px solid #333945; flex:1 1 auto; min-width:0; }
  @media(min-width:760px){ .ws-switch{ flex:0 1 430px; } }
  .ws-switch button{ flex:1; min-height:56px; padding:8px 10px; font-size:15px; font-weight:700; border:0; background:#1B1E24; color:#E6E8EB; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ws-switch button.on-h{ background:var(--cyan-dim); color:#67E8F9; }
  .ws-switch button.on-c{ background:var(--amber-dim); color:#FCD34D; }
  .progress-box{ flex:1 1 180px; min-width:110px; }
  @media(max-width:639px){ .progress-box{ display:none; } }
  .progress-track{ height:8px; border-radius:99px; background:#232730; margin-top:3px; overflow:hidden; }
  .progress-fill{ height:100%; border-radius:99px; transition:width .3s; }
  .tutor-toggle{ flex:0 0 auto; min-height:56px; padding:8px 16px; border-radius:14px; font-size:15px; font-weight:700; border:1px solid #333945; background:#22262F; color:#E6E8EB; white-space:nowrap; }
  .tutor-toggle.on{ background:var(--cyan-dim); color:#67E8F9; }
  .edition-note{ font-size:11px; color:#9AA3B2; display:none; line-height:1.35; }
  @media(min-width:1100px){ .edition-note{ display:block; flex:0 1 260px; } }

  /* ---- workspace layout ---- */
  #ws-holoplot,#ws-autocad{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .ws-layout{ display:flex; flex-direction:column; flex:1 1 auto; min-height:0; height:100%; overflow:hidden; gap:8px; padding-top:8px; }
  .top-zone{ display:flex; flex-direction:column; flex:1 1 auto; min-height:0; gap:6px; overflow:hidden; }
  .top-zone-compact{ flex:0 0 auto; }
  .map-shell{ flex:1 1 auto; min-height:118px; display:flex; flex-direction:column; overflow:hidden; border-radius:14px; }
  .map-shell > svg{ flex:1 1 auto; min-height:0; height:auto !important; max-height:none !important; }
  .map-shell > *:not(svg){ flex:0 0 auto; }
  .cad-shell > *:not(svg){ flex:0 0 auto; }
  .cad-shell{ flex:1 1 auto; min-height:132px; display:flex; flex-direction:column; overflow:hidden; border-radius:14px; }
  .cad-shell > svg{ flex:1 1 auto; min-height:0; height:auto !important; max-height:none !important; }
  .scroll-panel{ flex:0 0 36%; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior:contain; scrollbar-gutter:stable; padding:2px 2px 10px; border-top:1px solid var(--border); }
  @media(max-height:860px) and (min-width:700px){
    .scroll-panel{ flex-basis:33%; }
    .chip{ min-height:76px !important; padding:10px !important; }
  }
  /* AutoCAD: canvas is the flexible space, deck scrolls below */
  #ws-autocad .scroll-panel{ flex-basis:33%; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; }
  .btn{ min-height:52px; padding:10px 16px; border-radius:12px; font-size:15px; font-weight:700; background:var(--surface2); border:1px solid var(--border); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn-sm{ min-height:48px; padding:8px 12px; font-size:14px; }
  .tog-on{ background:var(--cyan-dim) !important; color:#67E8F9 !important; }
  .field{ width:100%; border-radius:12px; padding:10px 12px; min-height:52px; font-size:16px; background:var(--surface2); border:1px solid var(--border); }
  .deck{ display:flex; border-radius:14px; overflow:hidden; border:1px solid var(--border); background:var(--surface); box-shadow:0 4px 14px rgba(0,0,0,.22); position:sticky; top:0; z-index:5; }
  .deck button{ flex:1; min-height:56px; padding:8px 4px; font-size:13px; font-weight:700; line-height:1.25; background:var(--surface); border:0; border-left:1px solid var(--border); min-width:0; }
  .deck button:first-child{ border-left:0; }
  @media(min-width:640px){ .deck button{ font-size:15px; } }
  .deck button.on-h{ background:var(--cyan-dim); color:#67E8F9; }
  .deck button.on-c{ background:var(--amber-dim); color:#FCD34D; }
  .mode-switch{ display:flex; border-radius:12px; overflow:hidden; border:1px solid var(--border); flex:0 1 300px; min-width:210px; }
  .mode-switch button{ flex:1; min-height:48px; padding:8px 12px; font-size:14px; font-weight:700; border:0; background:var(--surface); color:var(--text); white-space:nowrap; }
  .mode-switch button.on-p{ background:var(--cyan-dim); color:#67E8F9; }
  .mode-switch button.on-e{ background:var(--red); color:var(--red-text); }
  .edit-banner{ background:#2A1215; border:1px solid var(--red); color:var(--red-text); border-radius:12px; padding:10px 14px; font-size:13px; margin:0; }
  @media (prefers-color-scheme: light){ .edit-banner{ background:#FDECEC; color:#7F1D1D; } }
  .chip{ border-radius:12px; padding:12px; min-height:88px; background:var(--surface2); border:1px solid var(--border); cursor:pointer; text-align:left; overflow:hidden; }
  .chip.lit-h{ background:var(--cyan-dim); }
  .chip.lit-c{ background:var(--amber-dim); }
  .chip.editing{ border:2px solid #F87171; }
  .readout-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; padding:8px; background:var(--surface); flex:0 0 auto; }
  @media(min-width:640px){ .readout-grid{ grid-template-columns:repeat(6,minmax(0,1fr)); } }
  .readout{ background:var(--surface2); border-radius:10px; padding:8px 4px; text-align:center; min-width:0; }
  .readout .v{ font-weight:700; font-size:18px; white-space:nowrap; }
  .readout .l{ font-size:10px; color:var(--dim); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .slider-row{ margin-top:8px; background:var(--surface2); border-radius:12px; padding:8px 10px; min-width:0; }
  .stepper{ width:48px; height:48px; border-radius:12px; font-size:22px; font-weight:700; background:var(--surface); border:1px solid var(--border); flex:none; touch-action:manipulation; }
  .tool-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; flex:0 0 auto; }
  @media(min-width:640px){ .tool-grid{ grid-template-columns:repeat(6,minmax(0,1fr)); } }
  @media(min-width:1024px){ .tool-grid{ grid-template-columns:repeat(12,minmax(0,1fr)); } }
  .tool-grid button{ min-height:56px; padding:8px 2px; border-radius:14px; font-size:13px; font-weight:700; line-height:1.25; background:var(--surface); border:1px solid var(--border); min-width:0; overflow:hidden; }
  .tool-grid button.on{ background:var(--amber-dim); color:#FCD34D; border:2px solid var(--amber); }
  .legend-bar{ display:flex; flex-wrap:wrap; gap:4px 12px; padding:6px 10px; font-size:11px; align-items:center; background:#0F172A; color:#CBD5E1; flex:0 0 auto; }
  .swatch{ display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:5px; }
  .lesson{ background:var(--surface2); border-radius:12px; padding:12px; min-width:0; }
  .tutor-pill{ position:fixed; left:50%; transform:translateX(-50%); z-index:60; min-height:56px; padding:12px 22px;
    border-radius:99px; font-size:16px; font-weight:700; background:var(--cyan-dim); color:#A5F3FC; border:2px solid var(--cyan);
    box-shadow:0 10px 30px rgba(0,0,0,.45); max-width:94vw; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); }
  .grid2{ display:grid; gap:8px; } @media(min-width:768px){ .grid2{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .grid3{ display:grid; gap:8px; } @media(min-width:768px){ .grid3{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  a{ color:var(--cyan); }
  code{ background:var(--surface2); padding:1px 6px; border-radius:6px; font-size:.92em; overflow-wrap:anywhere; }
  svg{ touch-action:none; }
  /* display-controls strip: one compact, aligned row */
  .display-controls{ display:flex; flex-direction:column; gap:6px; flex:0 0 auto; }
  .display-row{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; min-width:0; }
  .display-row .btn-sm{ min-height:48px; }
  /* tutor + github footers: compact bars that never push the workspace off-screen */
  #tutor-section{ flex:0 0 auto; margin-top:8px; min-width:0; }
  #tutor-section:empty{ display:none; }
  #tutor-section.tutor-open{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 10px); width:min(680px,94vw); max-height:58dvh; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior:contain; z-index:56; margin:0; box-shadow:0 16px 44px rgba(0,0,0,.5); border-radius:14px; }
  .tutor-bar{ display:flex; align-items:center; gap:10px; padding:8px 12px; }
  .tutor-bar .tutor-intro{ display:none; }
  .tutor-bar h2{ flex:0 0 auto; }
  .tutor-topics{ display:flex; gap:6px; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; touch-action:pan-x; padding:2px; min-width:0; }
  .tutor-topics button{ flex:0 0 auto; }
  .github-card{ margin-top:10px; padding:12px 14px; }
  .github-card h2{ margin:0 0 6px; font-size:15px; }
  .github-card p{ margin:0; font-size:13px; line-height:1.55; color:var(--dim); }
  @media(max-height:860px){
    .header-in{ padding-top:6px; padding-bottom:6px; }
    #tutor-section .tutor-intro{ display:none; }
  }
  @media(min-width:900px) and (orientation:landscape){
    .ws-layout{ flex-direction:row; gap:10px; }
    .top-zone{ flex:1 1 57%; min-width:0; }
    .scroll-panel{ flex:0 0 41%; border-top:0; border-left:1px solid var(--border); padding-left:10px; }
    #ws-autocad .scroll-panel{ flex-basis:41%; }
  }
  @media(max-width:700px){
    .ws-hint{ display:none; }
    #ws-holoplot .top-zone > div:first-child{ flex-wrap:nowrap !important; gap:6px !important; }
    #ws-holoplot .top-zone > div:first-child > div{ min-width:0 !important; }
    #h-side{ font-size:12px !important; padding:8px 10px !important; white-space:nowrap; }
    .map-shell{ flex:0 0 252px; }
    .cad-shell{ flex:0 0 318px; }
    .readout-grid{ grid-template-columns:repeat(6,minmax(0,1fr)); padding:6px; gap:4px; }
    .readout .v{ font-size:13px; }
    .readout .l{ font-size:8px; }
    .display-row .btn-sm{ font-size:13px; padding:8px 9px; }
    #ws-autocad .top-zone > p[aria-label="Command key legend"]{ display:none; }
    .tool-grid{ grid-template-columns:repeat(6,minmax(0,1fr)); }
    .tool-grid button{ font-size:11px; min-height:44px; }
    .cad-shell{ flex-basis:216px; }
    #ws-autocad .scroll-panel{ flex-basis:22%; }
    #c-history{ height:40px !important; }
    .snap-row{ flex-wrap:nowrap !important; overflow-x:auto; overflow-y:hidden; touch-action:pan-x; -webkit-overflow-scrolling:touch; }
    .snap-row > *{ flex:0 0 auto; }
    .readout .v{ font-size:11px; }
    .ws-switch button{ font-size:13px; padding:8px 4px; }
    .tutor-toggle{ font-size:13px; padding:8px 10px; }
    .tutor-bar h2{ display:none; }
    .scroll-panel{ flex-basis:30%; }
    .display-controls [data-role="hover-hint"]{ display:none; }
    .display-controls [data-role="mode-hint"]{ display:none; }
    .mode-switch{ flex-basis:100%; }
    .readout .v{ font-size:11px; }
    .deck button{ font-size:12px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-in">
    <div class="ws-switch" role="tablist" aria-label="Workspace switcher">
      <button id="tab-holoplot" role="tab">◉ HOLOPLOT Plan</button>
      <button id="tab-autocad" role="tab">⌖ AutoCAD</button>
    </div>
    <div class="progress-box">
      <div class="mono" style="display:flex;justify-content:space-between;font-size:11px;color:#9AA3B2"><span>PRACTICE PROGRESS</span><span id="progress-label"></span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <button id="tutor-toggle" class="tutor-toggle" aria-pressed="true">🎓 Tutor ON</button>
    <p class="edition-note mono">BASIC WEB PRACTICE EDITION<br/>Not HOLOPLOT / Autodesk software — concepts &amp; muscle memory</p>
  </div>
</header>

<main class="wrap">
  <div id="ws-holoplot"></div>
  <div id="ws-autocad" hidden></div>

  <section id="tutor-section" aria-label="Virtual tutor"></section>

</main>

<button id="tutor-pill" class="tutor-pill" hidden></button>

<script>
"use strict";
/* ================= shared ================= */
function splColor(spl){
  if(spl<55) return "#1e293b";
  if(spl<65) return "#1d4ed8";
  if(spl<75) return "#0891b2";
  if(spl<85) return "#16a34a";
  if(spl<92) return "#eab308";
  if(spl<98) return "#f97316";
  return "#ef4444";
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- on-device storage (static site: no server) ---------- */
var LS_KEY="holoplot-autocad-practice-github-v1";
var store={ progress:[], saves:{ holoplot:[], autocad:[] } };
try{ var raw=localStorage.getItem(LS_KEY); if(raw){ var p=JSON.parse(raw); if(p&&p.progress&&p.saves) store=p; } }catch(e){}
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }
function doneSet(){ return new Set(store.progress); }
function markDone(id){ if(!store.progress.includes(id)){ store.progress.push(id); persist(); } renderProgress(); }
function addSave(ws,name,data){ store.saves[ws].push({id:Date.now(),name:name,data:data}); persist(); }
function deleteSave(ws,id){ store.saves[ws]=store.saves[ws].filter(function(s){return s.id!==id;}); persist(); }

/* ---------- virtual tutor: built-in explanations, no server ---------- */
var TUTOR_DICT=[
  {keys:["azimuth"],expl:"Azimuth steers a beam left or right in plan (top-down) view, measured in degrees from straight ahead. Negative aims left, positive aims right. Try it: move Array L to about -18° and Array R to +18° so the two beams split the stalls instead of both firing down the middle."},
  {keys:["tilt","elevation"],expl:"Tilt (elevation) aims a beam up or down in side view. Raise tilt to throw energy up to a balcony or raked seating; lower it for flat stalls. Too much tilt spills onto the ceiling, too little leaves the back rows quiet."},
  {keys:["beam width","horizontal beam","vertical beam"],expl:"Beam width is how wide a beam spreads, in degrees. Narrow beams throw farther with less spill but can leave gaps; wide beams fill evenly up close but spill onto walls. Match the width to the zone you are covering."},
  {keys:["beamforming"],expl:"3D Audio-Beamforming is HOLOPLOT's core idea: hundreds of drivers in one array are driven individually so the array synthesises beams of sound and aims them at chosen zones — and keeps other areas quiet. You design coverage, not just speaker placement."},
  {keys:["spl","sound pressure"],expl:"SPL (Sound Pressure Level) is loudness in decibels (dB) at a point in the room. On the coverage map each colour is an SPL band. Your goal is usually one even colour across the audience — not the loudest possible number."},
  {keys:["uniformity"],expl:"Uniformity is how even the SPL is across a zone — here half the gap between the loudest and quietest audience cells, in ± dB. Lower is better: within about ±3 dB feels even; big numbers mean hot spots and dead spots."},
  {keys:["spill"],expl:"Spill is sound landing where you do not want it — outside the audience, on walls, stage or neighbours — above 75 dB here. High spill wastes energy, hurts intelligibility and can cause complaints. Narrower beams and careful azimuth reduce it."},
  {keys:["coverage"],expl:"Coverage is the share of the audience area reaching a usable level (here at least 78 dB). High coverage with low spill is the win: everyone hears it, nobody outside the zone gets blasted."},
  {keys:["gain"],expl:"Gain is the level trim for an array or beam, in dB. Use it to balance zones against each other — for example pulling a near stalls beam down so a far balcony beam can match it — rather than turning everything up."},
  {keys:["x1","x2","array"],expl:"X1 and X2 are HOLOPLOT array modules. One array can emit several independent beams at different zones, levels and EQ. In this practice app each box is one array you can steer with azimuth, tilt, beam width and gain."},
  {keys:["dimension","dim"],expl:"A dimension measures the real distance between two points so a crew can build from the drawing. In AutoCAD, use DIM, click the two points, and the measured length (in feet here) is written on the drawing. Always dimension the things that get built: stage width, hang points, clearances."},
  {keys:["layer"],expl:"Layers organise a drawing like transparent sheets: Walls, Speakers, Seating, Stage, Dimensions and Notes each get their own layer, colour and visibility switch. Draw each kind of object on its own layer so views can be turned on and off for different readers."},
  {keys:["snap"],expl:"SNAP forces points onto a regular grid (2 ft here) so geometry lines up cleanly instead of landing at ragged fractions. ORTHO is different: it locks lines to horizontal or vertical only."},
  {keys:["ortho"],expl:"ORTHO locks drawing to horizontal and vertical only — essential for walls, stages and seating rows. Turn it off when you genuinely need a diagonal, like a thrust stage edge."},
  {keys:["command line","command:"],expl:"The command line is how AutoCAD pros actually drive the app: type a command (L for LINE, C for CIRCLE, REC for RECTANG), press Enter, then follow the prompts or type exact coordinates like 10,10. It is faster and more precise than hunting toolbars."},
  {keys:["polyline","pline"],expl:"A polyline (PLINE) is one connected object made of several line segments — good for cable runs, sight lines and room outlines. Click each point, then finish the polyline to close the sequence as a single selectable object."},
  {keys:["rectang","rectangle"],expl:"RECTANG draws a rectangle from two opposite corners. For a stage, click one corner then the opposite corner — or type exact coordinates — to get a precise 40 × 16 ft platform instead of a sketch."},
  {keys:["circle"],expl:"CIRCLE here stands in for a speaker, a column or a turning radius: pick the centre, then a point on the edge sets the radius. The Properties panel reports radius and area once drawn."},
  {keys:["hover","latched","momentary"],expl:"Hover values come in two flavours. Momentary: the value label shows only while your pointer or finger is on the item and disappears when you move away. Latched: tap or click once and the label stays pinned until you tap it again — better on touch screens and when comparing two beams."},
  {keys:["long-press","long press","edit values"],expl:"Edit Values mode is where value labels become editable. Switch to the Edit Values tab, then press and hold (long-press, about half a second) any beam or dimension value label — an editor opens so you can type a new value and save it. Practice mode keeps labels read-only so you cannot change a design by accident."}
];
function localExplain(raw){
  var t=raw.toLowerCase();
  for(var i=0;i<TUTOR_DICT.length;i++){ var e=TUTOR_DICT[i];
    for(var j=0;j<e.keys.length;j++){ if(t.indexOf(e.keys[j])>=0) return e.expl; } }
  return null;
}

/* ---------- long-press helper ---------- */
function makeLongPress(){
  var timers={}, fired={};
  return {
    start:function(key,fn){ fired[key]=false; timers[key]=window.setTimeout(function(){ fired[key]=true; fn(); },600); },
    cancel:function(key){ if(timers[key]) window.clearTimeout(timers[key]); },
    wasFired:function(key){ return !!fired[key]; }
  };
}

/* ---------- display controls (shared markup builder) ---------- */
function displayControlsHTML(ns){
  return ''+
  '<div class="display-controls">'+
    '<div class="display-row">'+
      '<div class="mode-switch" role="tablist" aria-label="Practice or edit values mode">'+
        '<button data-act="mode-practice" role="tab">▶ Practice</button>'+
        '<button data-act="mode-edit" role="tab">✎ Edit Values</button>'+
      '</div>'+
      '<button class="btn btn-sm" data-act="tog-legend" aria-pressed="true">Legend: ON</button>'+
      '<button class="btn btn-sm" data-act="tog-keys" aria-pressed="true">Keys &amp; Labels: ON</button>'+
      '<button class="btn btn-sm" data-act="tog-hover" aria-pressed="true">Hover values: ON</button>'+
      '<div style="display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--border)" role="group" aria-label="Hover text mode: momentary or latched">'+

function wireDisplayControls(root, st, rerender){
  function sync(){
    root.querySelector('[data-act="mode-practice"]').className = st.viewMode==="practice" ? "on-p" : "";
    root.querySelector('[data-act="mode-edit"]').className = st.viewMode==="edit" ? "on-e" : "";
    root.querySelector('[data-act="mode-practice"]').setAttribute("aria-selected", st.viewMode==="practice");
    root.querySelector('[data-act="mode-edit"]').setAttribute("aria-selected", st.viewMode==="edit");
    root.querySelector('[data-role="mode-hint"]').textContent = st.viewMode==="edit"
      ? "Edit Values mode: press and hold (long-press) any beam or dimension value label below to change its value."
      : "Practice mode: value labels are read-only.";
    root.querySelector('[data-role="edit-banner"]').hidden = st.viewMode!=="edit";
    var lg=root.querySelector('[data-act="tog-legend"]'); lg.textContent="Legend: "+(st.showLegend?"ON":"OFF"); lg.classList.toggle("tog-on",st.showLegend); lg.setAttribute("aria-pressed",st.showLegend);
    var ky=root.querySelector('[data-act="tog-keys"]'); ky.textContent="Keys & Labels: "+(st.showKeys?"ON":"OFF"); ky.classList.toggle("tog-on",st.showKeys); ky.setAttribute("aria-pressed",st.showKeys);
    var hv=root.querySelector('[data-act="tog-hover"]'); hv.textContent="Hover values: "+(st.showHover?"ON":"OFF"); hv.classList.toggle("tog-on",st.showHover); hv.setAttribute("aria-pressed",st.showHover);
    root.querySelector('[data-act="hover-momentary"]').classList.toggle("tog-on", st.hoverMode==="momentary");
    root.querySelector('[data-act="hover-latch"]').classList.toggle("tog-on", st.hoverMode==="latch");
    root.querySelector('[data-role="hover-hint"]').textContent = st.hoverMode==="momentary"
      ? "Momentary: values show only while you touch / hover the item."
      : "Latched: tap an item once and its values stay pinned until you tap it again.";
  }
  root.querySelector('[data-act="mode-practice"]').addEventListener("click",function(){ st.viewMode="practice"; sync(); rerender(); });
  root.querySelector('[data-act="mode-edit"]').addEventListener("click",function(){ st.viewMode="edit"; sync(); rerender(); });
  root.querySelector('[data-act="tog-legend"]').addEventListener("click",function(){ st.showLegend=!st.showLegend; sync(); rerender(); });
  root.querySelector('[data-act="tog-keys"]').addEventListener("click",function(){ st.showKeys=!st.showKeys; sync(); rerender(); });
  root.querySelector('[data-act="tog-hover"]').addEventListener("click",function(){ st.showHover=!st.showHover; sync(); rerender(); });
  root.querySelector('[data-act="hover-momentary"]').addEventListener("click",function(){ st.hoverMode="momentary"; sync(); rerender(); });
  root.querySelector('[data-act="hover-latch"]').addEventListener("click",function(){ st.hoverMode="latch"; sync(); rerender(); });
  sync();
  return sync;
}

<script>
"use strict";
/* ================= HOLOPLOT ================= */
var VENUES=[
  {id:"theatre",label:"Theatre — 800 cap",w:36,d:38,zones:[{name:"Stalls",x:-13,y:10,w:26,h:18},{name:"Balcony",x:-11,y:30,w:22,h:6}]},
  {id:"arena",label:"Arena Bowl",w:56,d:48,zones:[{name:"Floor",x:-16,y:14,w:32,h:20},{name:"Lower Bowl",x:-24,y:36,w:48,h:8}]},
  {id:"church",label:"Worship — Long Nave",w:22,d:44,zones:[{name:"Nave",x:-8,y:10,w:16,h:28},{name:"Choir",x:-6,y:40,w:12,h:4}]},
  {id:"festival",label:"Outdoor Festival",w:60,d:55,zones:[{name:"Main Field",x:-25,y:15,w:50,h:32}]},
  {id:"corp",label:"Corporate Ballroom",w:30,d:26,zones:[{name:"Seating",x:-12,y:8,w:24,h:15}]}
];
var H_LESSONS=[
  {id:"h1",title:"1 · What HOLOPLOT does differently",body:"Conventional line arrays throw sound in a fixed pattern. HOLOPLOT X1/X2 use 3D Audio-Beamforming: hundreds of drivers are driven individually so you synthesize beams and aim them at zones — and create quiet zones where you don't want sound. In Plan, you don't just place a speaker, you design coverage."},
  {id:"h2",title:"2 · Beams, azimuth & tilt",body:"Azimuth steers a beam left/right in plan view. Tilt / elevation aims it up/down in side view — critical for balconies and raked seating. Try it: drag Tilt to +8° and watch the Balcony zone light up while Stalls cool down."},
  {id:"h3",title:"3 · Beam width = control vs. throw",body:"Narrow beams (small °) throw farther with less spill but leave gaps between zones. Wide beams fill evenly up close but spill onto walls and ceilings, hurting intelligibility. Uniformity within ±3 dB across a zone is a pro target."},
  {id:"h4",title:"4 · Multiple beams from one array",body:"One HOLOPLOT array can emit several independent beams at different zones, levels and EQ. That's why the drill below asks you to run two arrays / beams: one for Stalls, one for Balcony, at matched SPL."},
  {id:"h5",title:"5 · Reading an SPL map honestly",body:"Red isn't 'better' — it's louder. Aim for one even colour across the audience, low energy outside it, and no hot spot at FOH. Check Avg, Uniformity (±) and Spill in the readout after every move, just like in Plan's simulation."}
];
var H_DRILLS=[
  {id:"hd1",title:"Drill A — Even Stalls",goal:"Avg SPL 82–92 dB in the audience AND uniformity ≤ 6 dB",test:function(s){return s.avg>=82&&s.avg<=92&&s.uni<=6;}},
  {id:"hd2",title:"Drill B — Tame the spill",goal:"Keep avg ≥ 80 dB while spill cells (>75 dB outside audience) ≤ 18%",test:function(s){return s.avg>=80&&s.spill<=18;}},
  {id:"hd3",title:"Drill C — Two-zone balance",goal:"Run 2+ arrays on, avg 84–94 dB, uniformity ≤ 4.5 dB",test:function(s){return s.avg>=84&&s.avg<=94&&s.uni<=4.5;},needs2:true}
];

var hs={
  venueId:"theatre", sel:1, showSide:false, deck:"arrays", saveName:"My theatre design",
  showLegend:true, showKeys:true, showHover:true, hoverMode:"momentary", viewMode:"practice",
  hovered:null, latched:[], editing:null, editMsg:"", openLesson:"h1",
  arrays:[
    {id:1,name:"Array L",model:"X2",x:-6,y:4,az:-10,tilt:0,hBeam:28,vBeam:18,gain:0,on:true},
    {id:2,name:"Array R",model:"X2",x:6,y:4,az:10,tilt:0,hBeam:28,vBeam:18,gain:0,on:true},
    {id:3,name:"Centre / Balcony",model:"X1",x:0,y:4,az:0,tilt:8,hBeam:20,vBeam:12,gain:-3,on:false}
  ]
};
var hLP=makeLongPress();
function hVenue(){ return VENUES.find(function(v){return v.id===hs.venueId;})||VENUES[0]; }
function hCur(){ return hs.arrays.find(function(a){return a.id===hs.sel;})||hs.arrays[0]; }
function hArrVisible(id){ return hs.showHover && ((hs.hoverMode==="momentary"&&hs.hovered===id)||(hs.hoverMode==="latch"&&hs.latched.indexOf(id)>=0)||hs.editing===id); }

function hCompute(){
  var venue=hVenue(), list=[];
  for(var gx=-venue.w/2; gx<venue.w/2; gx+=2) for(var gy=0; gy<venue.d; gy+=2){
    var px=gx+1, py=gy+1, energy=0;
    hs.arrays.forEach(function(a){ if(!a.on) return;
      var dx=px-a.x, dy=py-a.y, dist=Math.sqrt(dx*dx+dy*dy+16);
      var beamAng=Math.atan2(dx,dy)*180/Math.PI;
      var diff=beamAng-a.az; while(diff>180)diff-=360; while(diff<-180)diff+=360;
      var fall=-14*Math.pow(diff/Math.max(8,a.hBeam),2);
      var spl=104+a.gain-20*Math.log10(Math.max(2,dist))+Math.max(-32,fall);
      energy+=Math.pow(10,spl/10);
    });
    var splv=energy>0?10*Math.log10(energy):42;
    var inAud=venue.zones.some(function(z){return px>=z.x&&px<=z.x+z.w&&py>=z.y&&py<=z.y+z.h;});
    list.push({x:px,y:py,spl:splv,inAud:inAud});
  }
  var aud=list.filter(function(c){return c.inAud;}), out=list.filter(function(c){return !c.inAud;});
  var avg=aud.length?aud.reduce(function(s,c){return s+c.spl;},0)/aud.length:0;
  var mn=aud.length?Math.min.apply(null,aud.map(function(c){return c.spl;})):0;
  var mx=aud.length?Math.max.apply(null,aud.map(function(c){return c.spl;})):0;
  var spill=out.length?Math.round(out.filter(function(c){return c.spl>75;}).length/out.length*100):0;
  var coverage=aud.length?Math.round(aud.filter(function(c){return c.spl>=78;}).length/aud.length*100):0;
  return {cells:list, stats:{avg:Math.round(avg*10)/10, uni:Math.round((mx-mn)/2*10)/10, min:Math.round(mn), max:Math.round(mx), spill:spill, coverage:coverage}};
}

function hPlanSVG(cells){
  var venue=hVenue();
  var SX=function(mx){return 300+mx*9;}, SY=function(my){return 30+my*11;};
  var s='<svg viewBox="0 0 600 470" style="width:100%;height:100%;display:block;margin:0 auto;touch-action:none;user-select:none" role="img" aria-label="Top-down SPL coverage heatmap">';
  cells.forEach(function(c){ s+='<rect x="'+SX(c.x-1)+'" y="'+SY(c.y-1)+'" width="18" height="22" fill="'+splColor(c.spl)+'" opacity="'+(c.inAud?0.95:0.45)+'"/>'; });
  venue.zones.forEach(function(z){ s+='<rect x="'+SX(z.x)+'" y="'+SY(z.y)+'" width="'+(z.w*9)+'" height="'+(z.h*11)+'" fill="none" stroke="#fff" stroke-dasharray="5 4" stroke-width="1.5"/>';
    if(hs.showKeys) s+='<text x="'+(SX(z.x)+6)+'" y="'+(SY(z.y)+16)+'" fill="#fff" font-size="11" font-weight="700">'+esc(z.name)+'</text>'; });
  s+='<rect x="'+SX(-venue.w/2)+'" y="'+SY(0)+'" width="'+(venue.w*9)+'" height="62" fill="#111827" stroke="#475569"/><text x="300" y="'+SY(2.5)+'" fill="#94A3B8" font-size="12" text-anchor="middle" font-weight="700">STAGE</text>';
  hs.arrays.forEach(function(a){ if(!a.on) return; var rad=a.az*Math.PI/180, len=210;
    var bx=SX(a.x)+Math.sin(rad)*len, by=SY(a.y)+Math.cos(rad)*len, spread=a.hBeam*Math.PI/180*len;
    s+='<polygon points="'+SX(a.x)+','+SY(a.y)+' '+(bx-spread)+','+by+' '+(bx+spread)+','+by+'" fill="#22D3EE" opacity="0.13"/><line x1="'+SX(a.x)+'" y1="'+SY(a.y)+'" x2="'+bx+'" y2="'+by+'" stroke="#22D3EE" stroke-dasharray="4 4" opacity="0.7"/>'; });
  hs.arrays.forEach(function(a){
    s+='<g data-arr="'+a.id+'" style="cursor:pointer;opacity:'+(a.on?1:0.35)+'">';
    s+='<rect x="'+(SX(a.x)-30)+'" y="'+(SY(a.y)-17)+'" width="60" height="34" rx="6" fill="transparent"/>';
    s+='<rect x="'+(SX(a.x)-22)+'" y="'+(SY(a.y)-12)+'" width="44" height="24" rx="5" fill="'+(a.id===hs.sel?"#F59E0B":"#0E7490")+'" stroke="#fff" stroke-width="'+(a.id===hs.sel?2:1)+'"/>';
    if(hs.showKeys) s+='<text x="'+SX(a.x)+'" y="'+(SY(a.y)+4)+'" fill="#fff" font-size="10" text-anchor="middle" font-weight="800">'+esc(a.model)+'</text>';
    if(hArrVisible(a.id)){
      var tx=Math.min(396,SX(a.x)+16), ty=Math.max(6,SY(a.y)-52);
      s+='<g pointer-events="none"><rect x="'+tx+'" y="'+ty+'" width="196" height="62" rx="6" fill="#0F172A" stroke="#22D3EE"/>'+
        '<text x="'+(tx+8)+'" y="'+(ty+16)+'" fill="#A5F3FC" font-size="10" font-weight="700">'+esc(a.name)+' · '+esc(a.model)+' · '+(a.on?"ON":"OFF")+'</text>'+
        '<text x="'+(tx+8)+'" y="'+(ty+30)+'" fill="#E6E8EB" font-size="10">Az '+a.az+'° · Tilt '+a.tilt+'° · Gain '+a.gain+' dB</text>'+
        '<text x="'+(tx+8)+'" y="'+(ty+44)+'" fill="#E6E8EB" font-size="10">Beam '+a.hBeam+'° × '+a.vBeam+'° · Pos '+a.x+' m, '+a.y+' m</text>'+
        '<text x="'+(tx+8)+'" y="'+(ty+57)+'" fill="#8A919E" font-size="9">'+(hs.hoverMode==="latch"?"Latched — tap array again to unpin":"Momentary — shows while hovering")+'</text></g>';
    }
    s+='</g>';
  });
  return s+'</svg>';
}
function hSideSVG(){

  s+='<line x1="40" y1="400" x2="570" y2="400" stroke="#475569" stroke-width="2"/>';

  html+='<div class="readout-grid">'+metrics.map(function(m){return '<div class="readout"><div class="v mono">'+m[1]+'</div><div class="l mono">'+m[0]+'</div></div>';}).join("")+'</div>';
  html+='</section></div><div class="scroll-panel" data-scroll-panel>';

  /* beam value chips */

  var ea=hs.arrays.find(function(a){return a.id===hs.editing;});

function cToWorld(e, svg){
  var r=svg.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width*80, y=(e.clientY-r.top)/r.height*60;
  if(cs.ortho&&cs.pending[0]){ var p=cs.pending[0]; if(Math.abs(x-p.x)>Math.abs(y-p.y)) y=p.y; else x=p.x; }
  if(cs.snap){ x=Math.round(x/2)*2; y=Math.round(y/2)*2; }
  return {x:Math.round(x*10)/10, y:Math.round(y*10)/10};
}
function cRunCommand(raw){
  var c=raw.trim(); if(!c) return; cLog("> "+c);
  var up=c.toUpperCase();
  var coord=c.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
  if(coord){ cHandlePoint({x:Number(coord[1]),y:Number(coord[2])}); return; }
  if(up==="HELP"){ cLog("Commands: LINE (L), CIRCLE (C), RECTANG (REC), PLINE (PL), ARC (A), DIM, TEXT, ERASE (E), SELECT, UNDO (U), CLEAR, SNAP ON/OFF, ORTHO ON/OFF, TEMPLATE STAGE / ROOM / SPEAKERS","Or type a point like 10,10 while a draw command is active."); }
  else if(up==="L"||up==="LINE"){ cs.tool="line"; cLog("LINE — specify first point (click or type x,y):"); }
  else if(up==="C"||up==="CIRCLE"){ cs.tool="circle"; cLog("CIRCLE — specify center point:"); }
  else if(up==="REC"||up==="RECTANG"||up==="RECT"){ cs.tool="rect"; cLog("RECTANG — specify first corner:"); }
  else if(up==="PL"||up==="PLINE"){ cs.tool="polyline"; cLog("PLINE — specify points, then Finish Polyline:"); }
  else if(up==="A"||up==="ARC"){ cs.tool="arc"; cLog("ARC — specify start point:"); }
  else if(up==="DIM"||up==="D"){ cs.tool="dim"; cLog("DIMENSION — pick two points to measure:"); }
  else if(up==="E"||up==="ERASE"){ cs.tool="erase"; cLog("ERASE — click an object to delete it."); }
  else if(up==="SELECT"){ cs.tool="select"; cLog("SELECT — click an object to inspect it."); }
  else if(up==="U"||up==="UNDO"){ cUndo(); return; }
  else if(up==="CLEAR"){ cPushUndo(); cs.shapes=[]; cLog("All objects erased."); }
  else if(up==="SNAP ON"){ cs.snap=true; cLog("Snap ON"); }
  else if(up==="SNAP OFF"){ cs.snap=false; cLog("Snap OFF"); }
  else if(up==="ORTHO ON"){ cs.ortho=true; cLog("Ortho ON"); }
  else if(up==="ORTHO OFF"){ cs.ortho=false; cLog("Ortho OFF"); }
  else if(up.indexOf("TEMPLATE")===0){ cLoadTemplate(up.indexOf("ROOM")>=0?"room":up.indexOf("SPEAKER")>=0?"speakers":"stage"); return; }
  else cLog('Unknown command "'+c+'" — type HELP.');
  renderAutocad();
}

    else if(sh.type==="rect") s+='<rect x="'+Math.min(sh.x1,sh.x2)+'" y="'+Math.min(sh.y1,sh.y2)+'" width="'+Math.abs(sh.x2-sh.x1)+'" height="'+Math.abs(sh.y2-sh.y1)+'" '+attrs+'/>';
    else if(sh.type==="circle") s+='<g data-shape="'+sh.id+'" style="cursor:pointer"><circle cx="'+sh.x1+'" cy="'+sh.y1+'" r="'+sh.r+'" stroke="'+col+'" stroke-width="'+w+'" fill="none"/><line x1="'+(sh.x1-0.8)+'" y1="'+sh.y1+'" x2="'+(sh.x1+0.8)+'" y2="'+sh.y1+'" stroke="'+col+'" stroke-width="0.15"/><line x1="'+sh.x1+'" y1="'+(sh.y1-0.8)+'" x2="'+sh.x1+'" y2="'+(sh.y1+0.8)+'" stroke="'+col+'" stroke-width="0.15"/></g>';

  }
  if(cs.deck==="save"){
    html+='<section class="card" style="padding:14px" role="tabpanel" aria-label="Save drawing"><h2 style="margin:0;font-size:16px">💾 SAVE DRAWING</h2>'+
      '<label class="sr-only" for="c-savename">Drawing name</label><input id="c-savename" class="field" style="margin-top:12px" value="'+esc(cs.saveName)+'"/>'+
      '<button id="c-save" class="btn" style="width:100%;margin-top:10px;min-height:56px;background:var(--amber);color:#000;border:0">Save drawing ('+cs.shapes.length+' objects)</button>'+
      '<p style="font-size:13px;margin:8px 0 0;color:var(--dim)">Saved on this device, in this browser.</p>';
    store.saves.autocad.forEach(function(s){ html+='<div style="display:flex;gap:8px;margin-top:10px"><button data-cload="'+s.id+'" class="btn" style="flex:1;text-align:left">Load: '+esc(s.name)+'</button><button data-cdel="'+s.id+'" class="btn" aria-label="Delete '+esc(s.name)+'">✕</button></div>'; });
    html+='</section>';
  }
  html+='</div></div>';
  html+='<div id="c-lessons">'+lessonsHTML(C_LESSONS, cs.openLesson)+'</div>'+githubNoteHTML();
  html+='</div></div>';
  root.innerHTML=html;
  var _nsp=root.querySelector("[data-scroll-panel]"); if(_nsp) _nsp.scrollTop=_spTop;

  /* wiring */
  wireDisplayControls(document.getElementById("c-display"), cs, renderAutocad);
  root.querySelectorAll("[data-tool]").forEach(function(b){ b.addEventListener("click",function(){ cs.tool=b.getAttribute("data-tool"); cs.pending=[]; cLog(b.textContent.trim()+" active."); renderAutocad(); }); });
  document.getElementById("c-undo").addEventListener("click",cUndo);
  document.getElementById("c-finish").addEventListener("click",cFinishPoly);
  document.getElementById("c-clear").addEventListener("click",function(){ cPushUndo(); cs.shapes=[]; renderAutocad(); });
  document.getElementById("c-snap").addEventListener("click",function(){ cs.snap=!cs.snap; renderAutocad(); });
  document.getElementById("c-ortho").addEventListener("click",function(){ cs.ortho=!cs.ortho; renderAutocad(); });
  document.getElementById("c-grid").addEventListener("click",function(){ cs.showGrid=!cs.showGrid; renderAutocad(); });
  root.querySelectorAll("[data-template]").forEach(function(b){ b.addEventListener("click",function(){ cLoadTemplate(b.getAttribute("data-template")); }); });
  root.querySelectorAll("[data-cdeck]").forEach(function(b){ b.addEventListener("click",function(){ cs.deck=b.getAttribute("data-cdeck"); renderAutocad(); }); });
  var sc=document.getElementById("c-selshortcut"); if(sc) sc.addEventListener("click",function(){ cs.deck="props"; renderAutocad(); });
  var cmdInput=document.getElementById("c-cmd");
  cmdInput.addEventListener("input",function(e){ cs.cmd=e.target.value; });
  document.getElementById("c-cmdform").addEventListener("submit",function(e){ e.preventDefault(); var v=cs.cmd; cs.cmd=""; cRunCommand(v); });
  var hist=document.getElementById("c-history"); hist.scrollTop=hist.scrollHeight;

  var svg=document.getElementById("cad-svg");
  svg.addEventListener("pointermove",function(e){ var p=cToWorld(e,svg); if(p.x!==cs.cursor.x||p.y!==cs.cursor.y){ cs.cursor=p;
    var cv=document.getElementById("ch-v"), ch=document.getElementById("ch-h");
    if(cv){ cv.setAttribute("x1",p.x); cv.setAttribute("x2",p.x); } if(ch){ ch.setAttribute("y1",p.y); ch.setAttribute("y2",p.y); }
    var status=hist.lastElementChild; if(status) status.textContent="Cursor: "+p.x.toFixed(0)+", "+p.y.toFixed(0)+" ft · Tool: "+cs.tool.toUpperCase()+" · Layer: "+cs.activeLayer+" · Objects: "+cs.shapes.length;
  } });
  svg.addEventListener("pointerdown",function(e){ var shEl=(e.target&&e.target.closest)?e.target.closest("[data-shape]"):null; if(shEl) return; var p=cToWorld(e,svg); if(cs.tool==="erase"||cs.tool==="select") return; cHandlePoint(p); });
  svg.querySelectorAll("[data-shape]").forEach(function(el){
    var id=Number(el.getAttribute("data-shape"));
    el.addEventListener("mouseenter",function(){ if(cs.hovered!==id){ cs.hovered=id; renderAutocad(); } });
    el.addEventListener("mouseleave",function(){ if(cs.hovered!==null){ cs.hovered=null; renderAutocad(); } cLP.cancel("shape"+id); });
    el.addEventListener("pointerdown",function(){ if(cs.viewMode==="edit") cLP.start("shape"+id,function(){ cs.selected=id; cs.editing=id; cs.deck="dims"; renderAutocad(); }); });
    el.addEventListener("pointerup",function(){ cLP.cancel("shape"+id); });
    el.addEventListener("click",function(){ if(cLP.wasFired("shape"+id)) return;
      if(cs.tool==="erase"){ cPushUndo(); cs.shapes=cs.shapes.filter(function(x){return x.id!==id;}); cLog("Object erased."); }
      else { cs.selected=id; if(cs.hoverMode==="latch"&&cs.showHover){ var i=cs.latched.indexOf(id); if(i>=0)cs.latched.splice(i,1); else cs.latched.push(id); } }
      renderAutocad(); });
  });
  root.querySelectorAll("[data-dchip]").forEach(function(ch){
    var id=Number(ch.getAttribute("data-dchip"));
    ch.addEventListener("mouseenter",function(){ if(cs.hovered!==id){ cs.hovered=id; renderAutocad(); } });
    ch.addEventListener("mouseleave",function(){ if(cs.hovered!==null){ cs.hovered=null; renderAutocad(); } cLP.cancel("dchip"+id); });
    ch.addEventListener("focus",function(){ if(cs.hovered!==id){ cs.hovered=id; renderAutocad(); } });
    ch.addEventListener("blur",function(){ if(cs.hovered!==null){ cs.hovered=null; renderAutocad(); } });
    ch.addEventListener("click",function(){ if(cLP.wasFired("dchip"+id)) return; cs.selected=id;
      if(cs.hoverMode==="latch"&&cs.showHover){ var i=cs.latched.indexOf(id); if(i>=0)cs.latched.splice(i,1); else cs.latched.push(id); }
      renderAutocad(); });
    ch.addEventListener("pointerdown",function(){ if(cs.viewMode==="edit") cLP.start("dchip"+id,function(){ cs.selected=id; cs.editing=id; renderAutocad(); }); });
    ch.addEventListener("pointerup",function(){ cLP.cancel("dchip"+id); });
    ch.addEventListener("contextmenu",function(e){ if(cs.viewMode==="edit"){ e.preventDefault(); cs.selected=id; cs.editing=id; renderAutocad(); } });
  });
  root.querySelectorAll("[data-edit-shape]").forEach(function(b){ b.addEventListener("click",function(e){ e.stopPropagation(); cs.selected=Number(b.getAttribute("data-edit-shape")); cs.editing=cs.selected; renderAutocad(); }); });
  var ef=document.getElementById("c-editform");
  if(ef){ ef.addEventListener("submit",function(e){ e.preventDefault(); var fd=new FormData(ef);
      var es=cs.shapes.find(function(s){return s.id===cs.editing;}); if(!es) return;
      function num(n,fb){ var v=Number(fd.get(n)); return isFinite(v)?v:fb; }
      var nx1=num("x1",es.x1), ny1=num("y1",es.y1), nx2=num("x2",es.x2), ny2=num("y2",es.y2), nr=num("r",es.r);
      var ntext=String(fd.get("text")||es.text), isDim=es.type==="dim";
      var autoDim=Math.hypot(nx2-nx1,ny2-ny1).toFixed(1)+" ft";
      cPushUndo();
      cs.shapes=cs.shapes.map(function(x){ return x.id===es.id?Object.assign({},x,{x1:nx1,y1:ny1,x2:nx2,y2:ny2,r:nr,text:isDim?autoDim:ntext}):x; });
      cs.editMsg="Saved "+es.type.toUpperCase()+": ("+nx1+","+ny1+") → ("+nx2+","+ny2+")"+(isDim?" · dimension now "+autoDim:"")+" — drawing updated.";
      cs.editing=null; cLog("Edited "+es.type.toUpperCase()+" via Edit Values mode."); renderAutocad(); });
    document.getElementById("c-edit-cancel").addEventListener("click",function(){ cs.editing=null; renderAutocad(); });
  }
  if(cs.deck==="layers"){
    root.querySelectorAll("[data-layer]").forEach(function(b){ b.addEventListener("click",function(){ cs.activeLayer=b.getAttribute("data-layer"); renderAutocad(); }); });
    root.querySelectorAll("[data-layervis]").forEach(function(b){ b.addEventListener("click",function(){ var n=b.getAttribute("data-layervis"); cs.layers=cs.layers.map(function(x){return x.name===n?Object.assign({},x,{visible:!x.visible}):x;}); renderAutocad(); }); });
    document.getElementById("c-textval").addEventListener("input",function(e){ cs.textVal=e.target.value; });
  }
  if(cs.deck==="props"&&sel){
    var gd=document.getElementById("c-godims"); if(gd) gd.addEventListener("click",function(){ cs.deck="dims"; renderAutocad(); });
    var er=document.getElementById("c-erasesel"); if(er) er.addEventListener("click",function(){ cPushUndo(); cs.shapes=cs.shapes.filter(function(x){return x.id!==sel.id;}); cs.selected=null; renderAutocad(); });
  }
  if(cs.deck==="drills"){ root.querySelectorAll("[data-cdrill]").forEach(function(b){ b.addEventListener("click",function(){ markDone(b.getAttribute("data-cdrill")); renderAutocad(); }); }); }
  if(cs.deck==="save"){
    document.getElementById("c-savename").addEventListener("input",function(e){ cs.saveName=e.target.value; });
    document.getElementById("c-save").addEventListener("click",function(){ addSave("autocad", cs.saveName||"Untitled drawing", JSON.stringify({shapes:cs.shapes,layers:cs.layers})); renderAutocad(); });
    root.querySelectorAll("[data-cload]").forEach(function(b){ b.addEventListener("click",function(){ var s=store.saves.autocad.find(function(x){return x.id===Number(b.getAttribute("data-cload"));}); if(!s) return; try{ var d=JSON.parse(s.data); cs.shapes=d.shapes; if(d.layers) cs.layers=d.layers; cs.shapes.forEach(function(sh){ if(sh.id>=nextShapeId) nextShapeId=sh.id+1; }); }catch(e){} renderAutocad(); }); });
    root.querySelectorAll("[data-cdel]").forEach(function(b){ b.addEventListener("click",function(){ deleteSave("autocad", Number(b.getAttribute("data-cdel"))); renderAutocad(); }); });
  }
  wireLessons(document.getElementById("c-lessons"), C_LESSONS, cs, renderAutocad);
}
</script>
<script>
"use strict";
/* ================= app shell: workspaces, progress, tutor ================= */
var TOTAL_ITEMS=H_LESSONS.length+C_LESSONS.length+H_DRILLS.length+4;
var currentWs="holoplot";
function renderProgress(){
  var n=doneSet().size, pct=Math.round(n/TOTAL_ITEMS*100);
  document.getElementById("progress-label").textContent=n+"/"+TOTAL_ITEMS+" · "+pct+"%";
  var f=document.getElementById("progress-fill"); f.style.width=pct+"%"; f.style.background=currentWs==="holoplot"?"var(--cyan)":"var(--amber)";
}
function setWorkspace(ws){
  currentWs=ws;
  document.getElementById("ws-holoplot").hidden=ws!=="holoplot";
  document.getElementById("ws-autocad").hidden=ws!=="autocad";
  var th=document.getElementById("tab-holoplot"), tc=document.getElementById("tab-autocad");
  th.className=ws==="holoplot"?"on-h":""; tc.className=ws==="autocad"?"on-c":"";
  th.setAttribute("aria-selected",ws==="holoplot"); tc.setAttribute("aria-selected",ws==="autocad");
  renderProgress();
}
document.getElementById("tab-holoplot").addEventListener("click",function(){ setWorkspace("holoplot"); });
document.getElementById("tab-autocad").addEventListener("click",function(){ setWorkspace("autocad"); });

/* tutor */
var tutorOn=true, tutorSel="", tutorExpl="", tutorOpen=false;
var TUTOR_TOPICS=["Azimuth","Tilt","Beam width","SPL","Uniformity","Spill","Dimension","Layer","SNAP","ORTHO","Command line"];
function askTutor(text){
  var clean=(text||"").trim(); if(!clean) return;
  tutorSel=clean; tutorOpen=true;
  tutorExpl=localExplain(clean)||"That one is not in the tutor's built-in notes yet. Try a single term — like SPL, azimuth, tilt, beam width, dimension, layer, SNAP, ORTHO or command line — and the tutor will walk through it in plain language.";
  renderTutor();
}
function renderTutor(){
  var sec=document.getElementById("tutor-section"), pill=document.getElementById("tutor-pill");
  if(!tutorOn){ sec.innerHTML=""; sec.className=""; pill.hidden=true; return; }
  sec.className=tutorOpen?"tutor-open":"";
  if(tutorSel&&!tutorOpen){
    pill.hidden=false;
    pill.textContent="🎓 Explain: “"+(tutorSel.length>42?tutorSel.slice(0,42)+"…":tutorSel)+"”";
    pill.setAttribute("aria-label","Explain highlighted text with the virtual tutor: "+tutorSel.slice(0,60));
  } else pill.hidden=true;
  if(tutorOpen){
    sec.innerHTML='<div style="border-radius:14px;padding:14px;background:#0F2A33;border:1px solid var(--cyan)">'+
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px"><h2 style="margin:0;font-size:16px;color:#E6E8EB">🎓 Virtual Tutor</h2>'+
      '<button id="tutor-close" class="btn btn-sm" aria-label="Close virtual tutor">Close ✕</button></div>'+
      '<p class="mono" style="font-size:12px;margin:8px 0 0;color:#9AA3B2">YOU HIGHLIGHTED</p>'+
      '<p style="font-size:14px;font-weight:600;margin:2px 0 0;color:#E6E8EB">“'+esc(tutorSel)+'”</p>'+
      '<p style="font-size:14px;margin:12px 0 0;line-height:1.6;color:#E6E8EB">'+esc(tutorExpl)+'</p>'+
      '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px"><button id="tutor-again" class="btn" style="background:var(--cyan);color:#000;border:0">Explain this</button>'+
      '<button id="tutor-clear" class="btn">Clear highlight</button></div></div>';
    document.getElementById("tutor-close").addEventListener("click",function(){ tutorOpen=false; renderTutor(); });
    document.getElementById("tutor-again").addEventListener("click",function(){ askTutor(tutorSel); });
    document.getElementById("tutor-clear").addEventListener("click",function(){ tutorExpl=""; tutorSel=""; tutorOpen=false; renderTutor(); });
  } else {
    sec.innerHTML='<div class="card tutor-bar"><h2 style="margin:0;font-size:14px">🎓 Virtual Tutor</h2>'+
      '<p class="tutor-intro" style="font-size:13px;margin:4px 0 0;color:var(--dim)">Select (highlight) any word or line anywhere in the app — a lesson, a slider label, a readout — then tap the 🎓 Explain pill that appears. Or tap a topic:</p>'+
      '<div class="tutor-topics">'+TUTOR_TOPICS.map(function(t){return '<button class="btn btn-sm" data-topic="'+esc(t)+'" aria-label="Ask tutor about '+esc(t)+'">'+esc(t)+'</button>';}).join("")+'</div></div>';
    sec.querySelectorAll("[data-topic]").forEach(function(b){ b.addEventListener("click",function(){ askTutor(b.getAttribute("data-topic")); }); });
  }
}
document.getElementById("tutor-pill").addEventListener("click",function(){ askTutor(tutorSel); });
document.getElementById("tutor-toggle").addEventListener("click",function(){
  tutorOn=!tutorOn; if(!tutorOn) tutorOpen=false;
  var b=document.getElementById("tutor-toggle"); b.textContent="🎓 Tutor "+(tutorOn?"ON":"OFF"); b.classList.toggle("on",tutorOn); b.setAttribute("aria-pressed",tutorOn);
  renderTutor();
});
document.getElementById("tutor-toggle").classList.add("on");
function captureSelection(){
  if(!tutorOn) return;
  var s=(window.getSelection?window.getSelection().toString():"").trim();
  if(s.length>=3&&s.length<=300){ if(s!==tutorSel){ tutorSel=s; tutorOpen=false; renderTutor(); } }
}
var selTimer=null;
document.addEventListener("selectionchange",function(){ window.clearTimeout(selTimer); selTimer=window.setTimeout(captureSelection,350); });
document.addEventListener("mouseup",captureSelection);
document.addEventListener("touchend",function(){ window.setTimeout(captureSelection,300); });

/* init */
renderHoloplot();
renderAutocad();
renderTutor();
setWorkspace("holoplot");
</script>
</body>
</html>
